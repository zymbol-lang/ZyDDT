# The refusal axis — forms every engine must refuse.
#
# Carried over in spirit from ZyQuality's `reject/` (MIGRATION § 4): "the
# inverse assertion, which no consensus run can make".  A consensus run asks
# whether the engines agree; three engines that all wrongly ACCEPT a malformed
# program agree perfectly.  So this axis is the one place a claim is made rather
# than a question asked, and the claim is the weakest one that still bites:
# whatever the message, the program must not run.
#
# `expect` is what makes that different from `verdict.toml`, and it is only
# legitimate here because the assertion does not encode a belief about the
# *answer* — only about the *category* of answer.

id      = "refusal"
what    = "malformed programs no engine may accept"
engines = ["zytw", "zyvm", "zyjs"]
expect  = "error"        # any error; static or runtime is not asserted here

[[cell]]
id   = "assign-no-rhs"
what = "an assignment whose right-hand side is missing"
# DIVERGES as of 2026-08-27, zymbol 0.0.9: zytw and zyvm both answer
#   `error: expected expression, found Assign`
# and zyjs accepts the program, running it to completion with only
#   `warning: unused variable 'x'`
#
# Same family as DM-06 (`>> 1 == 1` parsed by zyjs and refused by the Rust
# engines), which was closed on 2026-08-18 by narrowing `parseOutput` from
# `parseExpr` to `parseAdditive`.  This is a different site — the right-hand
# side of an assignment, not an output argument — and the narrowing did not
# reach it.  Whether it becomes a numbered entry is the author's call; as a
# cell it needs no ID, which is exactly why the axis form finds things the
# finding-by-finding form waits for.
#
# CLOSED 2026-08-30 (ZYJS-001). The cause was not the assignment: the last two
# lines of zyjs's `parsePrimary` consumed ANY token no branch recognised and
# returned a Unit literal, so the stray `=` became `##_` and the assignment came
# out well-formed. The catch-all is gone; the five sibling forms below are here
# because one root cause with six symptoms and one cell is a cause that comes
# back through any of the other five.
src  = """
x = =
"""

[[cell]]
id   = "output-unparenthesised-comparison"
what = "a bare comparison as an output argument"
# The original DM-06. Kept as a cell so the fix is held down by the axis rather
# than by anyone remembering it — a closed finding with no cell is a finding
# that will be reopened by the next refactor.
src  = """
>> 1 == 1 ¶
"""

[[cell]]
id   = "undefined-variable"
what = "a name that was never defined"
src  = """
>> noexiste ¶
"""

[[cell]]
id   = "not-equal-is-not-a-symbol"
# SYM-4 of zymbol-design/PREMISES.md — no natural-language words in the grammar,
# and `!=` is the one a reader brings from every other language. The only cell in
# this repository that holds a premise of the sign system: its six siblings
# constrain a proposal rather than a program, and nothing executable can ask them.
premise = "SYM-4"
what = "`!=` is not a Zymbol operator; the language spells it `<>`"
# Arrived here from the operator axis, which had declared `!=` as one of its
# operators.  It is the mistake a reader brings from every other language, so it
# is worth a cell — but exactly one: the refusal happens while parsing and never
# reaches the operands, so crossing it with seventeen type pairs produced
# seventeen copies of this file.
#
# Measured 2026-08-29: all three engines refuse it, and zyjs says
# `— use '<>' for not-equal` where the Rust engines stop at the refusal. Whether
# the Rust engines should carry that guidance is the author's call; the cell
# holds the refusal down either way.
src  = """
>> (1 != 2) ¶
"""

# ── The other five faces of ZYJS-001 ─────────────────────────────────────────
#
# Every one of these was accepted by zyjs and refused by both Rust engines while
# `parsePrimary` ended in a catch-all. They are separate cells and not one,
# because the swallow was reached from a different token each time and a fix
# that guards only the token somebody tested is not a fix.

[[cell]]
id   = "expression-is-a-comma"
what = "a stray comma where an expression belongs"
src  = """
x = ,
"""

# The refusal quotes the token as the program writes it — `found ','`,
# `found '='` — and not as the lexer names it inside (GLB-028, decided
# 2026-09-25: it said `found Comma`). These two hold the spellings a table
# could get wrong: an alternative newline, and the two-character `<>`.
[[cell]]
id   = "expression-is-a-newline-mark"
what = "`¶` where an expression belongs is quoted as `'¶'`"
src  = """
x = ¶
"""

[[cell]]
id   = "expression-is-a-not-equal"
what = "`<>` where an expression belongs is quoted as `'<>'`"
src  = """
x = <>
"""

[[cell]]
id   = "match-arm-with-a-star"
what = "a `*` where a match pattern belongs"
# ZYJS-033, open: both Rust engines say `expected pattern, found '*'`, zyjs
# `expected expression, found '*'`.
src  = """
?? 3 { * => 1 }
"""

[[cell]]
id   = "fullwidth-question-mark"
what = "`？` (U+FF1F) where `?` belongs: a name to the lexer, so the refusal falls later"
# ZYJS-035, fixed 2026-09-26: both Rust engines said `unexpected token: '{'`,
# zyjs `expected expression, found '>'` — it could not read `x > 1` as a
# statement. Neither names the character: the editor does, as a warning
# (`confusable-character`, decided 2026-09-25), and the engines never will.
src  = """
x = 5
？ x > 1 {
    >> "mayor" ¶
}
"""

[[cell]]
id   = "expression-is-a-close-paren"
what = "a stray `)` where an expression belongs"
src  = """
x = )
"""

[[cell]]
id   = "expression-is-a-close-bracket"
what = "a stray `]` where an expression belongs"
src  = """
x = ]
"""

[[cell]]
id   = "expression-is-a-close-brace"
what = "a stray `}` where an expression belongs"
src  = """
x = }
"""

[[cell]]
id   = "operand-missing-after-plus"
what = "an arithmetic operator with nothing after it"
# Not the same question as the four above: here the swallow was reached from
# INSIDE an expression that had already started, which is the shape a real typo
# takes.
src  = """
x = 1 + =
"""

[[cell]]
id   = "output-is-nothing-at-all"
what = "a stray `=` in output position"
# The one that showed the swallow was not about assignment. zyjs printed a blank
# line and carried on to the next statement, exiting 0.
src  = """
>> (= ) ¶
>> "sigue" ¶
"""

# ── El operando de un operador `$` es código, y hay que mirarlo ──────────────
#
# `zymbol check` no descendía al operando de `$#`, `$?` ni `$??`: los tres
# brazos de `infer_expr` devolvían su tipo sin inferir lo que tenían dentro, y
# `infer_expr` es lo que hace las comprobaciones. Todo lo escrito ahí dentro
# pasaba sin mirar — un nombre que no existe, una llamada con la aridad mal, un
# parámetro `<~` sin marcar.
#
# Lo encontró la validación contra Chaturanga, y la prueba de que el hueco era
# real es dónde estaban los errores: **cuatro** llamadas de su suite habían
# olvidado la marca `<~`, y las cuatro estaban dentro de un `$#`. El autor la
# escribió en todos los sitios donde el analizador miraba.

[[cell]]
id   = "undefined-inside-a-collection-operand"
what = "a name that does not exist, as the operand of `$#`"
src  = """
s = noexiste$#
>> s ¶
"""

[[cell]]
id   = "undefined-inside-a-contains-operand"
what = "a name that does not exist, on the right of `$?`"
src  = """
s = [1, 2]$? noexiste
>> s ¶
"""

[[cell]]
id   = "arity-inside-a-collection-operand"
what = "a call with the wrong argument count, as the operand of `$#`"
# The same call one character to the left — `s = g(1, 2, 3)` — was refused all
# along. That is the shape of the hole: not a construct nobody checks, a
# POSITION nobody looked at.
src  = """
g(a, b) { <~ [a, b] }
s = g(1, 2, 3)$#
>> s ¶
"""

# The help of an arity refusal writes the signature as the CALLER writes it —
# the names, and `<~` where the call must spell it (GLB-040, decided
# 2026-09-25). It used to print inferred types, `g(Number, Number)`, which zyjs
# could not give; these hold the new wording in its edge cases.
[[cell]]
id   = "arity-signature-shows-the-output-mark"
what = "the signature in the help carries `<~` and leaves out `~`, which never reaches the caller"
src  = """
f(a~, b<~, c) { b = a + c }
y = 0
f(1, y<~)
>> y ¶
"""

[[cell]]
id   = "arity-of-a-function-without-parameters"
what = "a function that takes nothing, called with something: `expected signature: g()`"
src  = """
g() { <~ 1 }
>> g(5) ¶
"""

[[cell]]
id   = "arity-of-a-module-function"
what = "a module function called with the wrong count; no signature is offered, in either engine"
src  = """
<# ./m/saludo => m
>> m::saluda(1) ¶
"""
[cell.files]
"m/saludo.zy" = """
# saludo {
    #> { saluda }
    saluda() { <~ "hola" }
}
"""

# ── Dentro del cuerpo de una lambda de bloque (ZYTW-001) ────────────────────
#
# Hasta el 2026-09-12 el analizador no entraba en un `-> { … }`: el cuerpo de
# expresión iba a `infer_expr`, que es lo que comprueba, y el de bloque a
# `infer_return_type_from_block`, que sólo recolecta tipos de retorno. Todo lo
# escrito ahí dentro pasaba sin mirar.
#
# La celda que lo encontró preguntaba por un nombre fuera de alcance, que es una
# de las tres mitades. Estas son las otras dos, más la forma mínima de la
# primera: un hueco de una zona ciega no se cierra con el caso que lo destapó,
# porque la siguiente regresión entrará por cualquiera de las otras puertas.
#
# `m[i][j]` no está aquí a propósito: lo rechaza el PARSER, así que seguía
# fallando dentro de la lambda incluso cuando el analizador no miraba — y es lo
# que hacía que la zona ciega no lo pareciera.

[[cell]]
id   = "undefined-inside-a-lambda-block"
what = "a name that exists nowhere, inside a lambda's block body"
src  = """
f = () -> { >> jamas_definida ¶ }
f()
"""

[[cell]]
id   = "arity-inside-a-lambda-block"
what = "a call with the wrong argument count, inside a lambda's block body"
# The body uses BOTH parameters on purpose. With `{ <~ a }` the cell also asked
# about `unused variable 'b'`, which zyjs reports and the Rust engines do not —
# one cell, one question.
src  = """
g(a, b) { <~ a + b }
f = () -> { >> g(1) ¶ }
f()
"""

[[cell]]
id   = "output-mark-missing-inside-a-lambda-block"
what = "a call missing its `<~` mark, inside a lambda's block body"
src  = """
sube(b<~) { b = b + 1 }
y = 1
f = () -> { sube(y) }
f()
"""

# ── SYM-8: la modalidad va al final ────────────────────────────────────────

[[cell]]
id      = "modality-before-its-label"
premise = "SYM-8"
what    = "`@!outer` — a modal `!` with an argument after it"
# SYM-8 of zymbol-design/PREMISES.md: a modal `?` or `!` is the rightmost mark
# of an operator, which is why labelled break is `@:outer!`. The form is refused,
# though not by a message that says so: the parser reads `@!` as a bare break and
# `outer` as an expression, so what comes out is `undefined variable 'outer'`.
# Recorded here because the cell asserts the refusal and not the wording — the
# same asymmetry SYM-4 shows, where `!=` explains itself and a keyword does not.
src     = """
@:outer _i:1..3 { @!outer }
"""

[[cell]]
id   = "undefined-name-in-string-interpolation"
what = "`{name}` of a name that is nothing — not a variable, a function or a module alias — at file level and inside a function"
# Decided 2026-09-15 (GLB-018 A): a static error. Until then all three engines
# printed `{nadie}` as text, silently, and `zymbol check` said nothing; only the
# tree-walker's `<<` prompt failed, at run time. The corpus file
# modules_scope/interp_global_const.zy asserted the literal form, and lost those
# two lines the same day.
src  = """
>> "a {nadie} b" ¶
f(v) { <~ "{v} {tampoco}" }
>> f(1) ¶
"""

[[cell]]
id   = "lone-tilde"
what = "a `~` with nothing to mark — `1 ~ 2`: both Rust engines refuse the token, and zyjs dropped it and printed `12` (found in step 2.1, 2026-09-15; ZYJS-020)"
src  = """
x = 1 ~ 2
>> x ¶
"""

[[cell]]
id   = "stray-literal-statement"
what = "a literal on its own after an index — `x[1] 5`: both Rust engines refuse the `5` as a statement, zyjs ran it and said nothing (found in step 2.3, 2026-09-15; ZYJS-021)"
src  = """
x = [1, 2]
x[1] 5
>> x ¶
"""

[[cell]]
id     = "undefined-name-inside-a-tui-block"
expect = "error"
what   = "a name that does not exist, read in a string inside a TUI block: the Rust type checker never enters `>>| { … }`, so it gets as far as opening the alternate screen (found in step 2.17, 2026-09-15; GLB-030)"
src    = """
>>| {
    >> "{nada}" ¶
}
"""

[[cell]]
id     = "lone-hash-at-end-of-line"
expect = "error"
what   = "a `#` that begins nothing is refused — both Rust engines say so, and zyjs dropped it without a sound and printed 1 (found in step 2.18, 2026-09-16; ZYJS-025 B)"
src    = """
x = 1 #
>> x ¶
"""

[[cell]]
id   = "match-arm-with-an-at-sign"
what = "`@` where a match pattern belongs — refused with the pattern's words in both"
src  = """
?? 3 { @ => 1 }
"""
