# The numerals axis — the shape ZyQuality already had right, declared once.
#
# `zyquality/corpus/i18n/numerals/` is 69 files, one per script, each a copy of
# the same program with a different digit block substituted in.  CHARTER § 2.2
# names it the counter-example already in the tree: it is exhaustive over a
# DECLARED axis, so its coverage is a fact rather than a hope.  It was also
# written out sixty-nine times, which means the answer to *"is Ol Chiki
# covered?"* lived in a directory listing, and the answer to *"is anything
# missing?"* lived nowhere at all.
#
# This file is that axis.  The values below are `DIGIT_BLOCKS` from
# `zymbol-lexer/src/digit_blocks.rs` — the table the language itself consults —
# transcribed mechanically, ids and all.  69 values × 1 template = 69 cells, and
# adding the 70th script to the language is one row here.
#
# ── This axis has an oracle, and that is unusual for i18n ────────────────────
#
# Most output questions have no independent authority: no other language can say
# how Zymbol renders a dictionary.  This one does, because the rule is arithmetic
# and Unicode publishes it:
#
#     digit_at(d) = chr(block_base + d)
#
# So Python can compute what every one of the 69 scripts must print, from the
# block base alone, without knowing anything about Zymbol.  That turns 69 cells
# from *"the three engines agree"* into *"the three engines agree AND the answer
# is right"* — which matters here more than almost anywhere, because a shared
# lookup table is exactly the kind of thing three engines inherit identically
# and identically wrong.
#
# ── What the template asks, and why each line is there ───────────────────────
#
#   12 * 34     a COMPUTED integer.  A literal would be a number typed twice —
#               see `arithmetic.toml`'s i53-boundary and `axes.suggestive`.
#   0 - 7       the sign.  `-` stays ASCII in every script; `numeral_mode.rs`
#               says so and nothing executable said it.
#   19.0 / 4    the separator.  `4.75` is `٤٫٧٥` under Arabic and `४.७५` under
#               Devanagari: exactly two of the 69 blocks encode their own
#               decimal separator, and the rule is Unicode's, not a locale's.
#   (3 > 2)     a boolean.  `#1` renders its digit through the script and keeps
#               an ASCII `#`, which is a rule with no other test.
#
# The parentheses around the comparisons are not style: a bare `>> 3 > 2 ¶` is
# refused by both Rust engines (DM-06), so the template that would read better
# is the one that does not run.

id      = "numerals"
what    = "every digit block the lexer declares, printed through `#NN#`"
engines = ["zytw", "zyvm", "zyjs"]

[[dimension]]
name     = "script"
defaults = { decimal = "." }
# `base` is the codepoint written the way Unicode writes it — a STRING, because
# the template prints it as `U+0660` and TOML's `0x0660` is the integer 1632.
# The oracle
# derives everything it needs from `zero`, because that is what the language
# does — `digit_value = codepoint − block_base`.
values = [
  { id = "ascii", name = "ASCII", base = "0030", zero = "0", nine = "9" },
  { id = "arabic-indic", name = "Arabic-Indic", base = "0660", zero = "٠", nine = "٩", decimal = "٫" },
