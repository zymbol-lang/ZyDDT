[matrix]
id   = "«script.id»"
what = "«script.name» (U+«script.base»)"
src  = """
#«script.zero»«script.nine»#
>> 12 * 34 ¶
>> 0 - 7 ¶
>> 19.0 / 4 ¶
>> (3 > 2) ¶
>> (2 > 3) ¶
"""
oracle.py = """
# «script.name», block base U+«script.base».  Nothing here knows any Zymbol:
# the digit is the codepoint offset, which is Unicode's rule, and the decimal
# separator is the one Unicode names for the script — ASCII '.' for all but the
# two Arabic blocks.
zero, dec = ord("«script.zero»"), "«script.decimal»"


def digits(x):
    return "".join(chr(zero + int(c)) if c.isdigit() else dec if c == "." else c
                   for c in str(x))


print(digits(12 * 34))
print(digits(0 - 7))
print(digits(19.0 / 4))
print("#" + digits(1))     # a bool keeps an ASCII '#' and scripts its digit
print("#" + digits(0))
"""
