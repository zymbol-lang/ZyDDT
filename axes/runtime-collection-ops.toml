# ── The empty pattern (added 2026-10-02, decided 2026-10-03) ───────────────
#
# Two of the eight cases ZyQuality seeded on 2026-08-07 for an oracle phase that
# was never built (zyquality/cases/). Nothing ran that directory, and both still
# diverged on the day it was retired. Decided 2026-10-03 (GLB-078, GLB-079): an
# empty pattern is a ##Index for the three operators that LOCATE occurrences —
# `$??`, `$/`, `$~~`. Each defensible answer (every boundary, none, with or without
# empty ends) was a host library deciding for Zymbol. `$? ""` (#1) and `$-`/`$--`
# with "" (nothing removed) stay: their answer does not depend on the reading.
#
# Each cell is a `!?` with ONE `:! ##Index`: an engine that answers instead of
# refusing reaches `1 / 0`, a ##Div that escapes, so it cannot pass by silence.

[[cell]]
id     = "find-all-of-the-empty-string"
what   = "every position of the empty string in a text: refused, a ##Index (GLB-078)"
expect = "ok"
src    = """
!? {
    _r = "hello"$?? ""
    // reached only if nothing refused: a ##Div no `:! ##Index` catches
    >> 1 / 0 ¶
} :! ##Index {
    >> "Index" ¶
}
"""

[[cell]]
id     = "split-by-the-empty-string"
what   = "a text split by the empty string: refused, a ##Index (GLB-079)"
