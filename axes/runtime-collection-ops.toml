[[cell]]
id     = "remove-count-out-of-bounds-for-collection"
expect = "error"
what   = "$-[{}:{}] out of bounds for collection of length {} — the COUNT form"
# The count form had no cell of its own, and all three engines were wrong about
# it in different ways (step G3, 2026-09-22): the VM folded the count into an
# end, so it printed `$-[2..4]`; `zyjs` clamped with `splice` and answered
# `[1]`; the tree-walker printed the range spelling `$-[2..3]` for something
# the reader wrote as `[2:3]`, which are different requests.
src    = """
t(v) {
    <~ [1, 2, 3]$-[2:v]
}
>> t(3) ¶
"""

[[cell]]
id     = "remove-count-out-of-bounds-for-collection-met"
expect = "ok"
what   = "and inside `!?` it is met, with the family the catch received"
src    = """
