what   = "the refusal of `$~~` with an empty pattern, uncaught: what a program that meets it prints"
expect = "error"
src    = """
>> ("hello"$~~["":"X"]) ¶
"""

[[cell]]
id     = "the-empty-string-is-contained"
what   = "`$? \"\"` is #1 and `$-- \"\"` removes nothing — the neighbours that stay as they were (decided 2026-10-03)"
expect = "ok"
src    = """
>> ("hello"$? "") ¶
>> ("hello"$-- "")$# ¶
"""
oracle.py = """
print("#1" if "" in "hello" else "#0")
print(len("hello".replace("", "", 0)))
"""

# ── Where a pattern is found (added 2026-10-03) ─────────────────────────────
#
# Measured beside the empty pattern. Overlapping matches are DECIDED (GLB-081):
# every position the pattern starts at, as "all positions of a pattern" reads.
# The other three were plain bugs, one engine against the two that agreed.

[[cell]]
id   = "find-all-overlapping"
what = "every position a pattern starts at, overlapping: `\"aaaa\"$?? \"aa\"` (GLB-081; the VM skipped the overlaps)"
src  = """
>> ("aaaa"$?? "aa") ¶
"""
oracle.py = """
s, p = "aaaa", "aa"
print("[" + ", ".join(str(i + 1) for i in range(len(s) - len(p) + 1) if s.startswith(p, i)) + "]")
"""

[[cell]]
id   = "find-all-of-a-pattern-longer-than-the-text"
what = "a pattern longer than the text is found nowhere — the tree-walker panicked (GLB-082)"
src  = """
>> ("ab"$?? "abc") ¶
"""
oracle.py = """
s, p = "ab", "abc"
print("[" + ", ".join(str(i + 1) for i in range(len(s) - len(p) + 1) if s.startswith(p, i)) + "]")
"""

[[cell]]
id   = "find-all-of-a-char-in-a-non-ascii-text"
what = "the positions of a char in a text that is not ASCII, not the ordinals of the matches (GLB-083)"
src  = """
>> ("ñaña"$?? 'a') ¶
"""
oracle.py = """
s = "ñaña"
print("[" + ", ".join(str(i + 1) for i, c in enumerate(s) if c == "a") + "]")
"""

[[cell]]
id   = "replace-first-n-does-not-look-at-what-it-wrote"
what = "replacing the first N never finds the text it has just written: `\"l\"` → `\"Ll\"` twice (GLB-084)"
src  = """
>> ("hello"$~~["l":"Ll":2]) ¶
>> ("hello"$~~['l':"Ll":2]) ¶
"""
oracle.py = """
print("hello".replace("l", "Ll", 2))
print("hello".replace("l", "Ll", 2))
"""

# ── An empty array, reassigned (added 2026-10-05) ───────────────────────────
#
# The Rust analyser typed `[]` as `[Any]` and warned when the name then took a
# typed array — `[Any] but assigned [String]`, and back. Decided 2026-10-05
# (GLB-093): an empty array has no element type to change, so neither analyser
# warns. `[Int]` against `[Float]` still differs.

[[cell]]
id     = "empty-array-reassigned-with-elements"
expect = "ok"
what   = "`x = []` then `x = [\"a\"]`: the array being filled, not a type change — nothing warns (GLB-093)"
src    = """
x = []
x = ["a"]
>> x ¶
"""

[[cell]]
id     = "array-of-another-element-type-warns"
expect = "warn"
what   = "the control: `x = [1]` then `x = [\"a\"]` is still a change, `[Int]` to `[String]`, in both analysers"
# Until GLB-104 (decided 2026-10-07) this control was `[1]` then `[1.5]`. Int
# and Float now fit each other inside an array as at the top level, so that one
# is the cell below, and this one keeps its claim with an element type that is
# a change.
src    = """
x = [1]
x = ["a"]
>> x ¶
"""

[[cell]]
id     = "array-of-floats-for-ints-is-no-change"
expect = "ok"
what   = "`x = [1]` then `x = [1.5]`: Int and Float fit inside an array as at the top level, and nothing warns (GLB-104)"
src    = """
x = [1]
x = [1.5]
>> x ¶
"""
