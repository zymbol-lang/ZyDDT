    <~ [1, 2, 3]$-[2:v]
}
!? {
    >> t(3) ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

[[cell]]
id     = "remove-count-of-zero-removes-nothing"
expect = "ok"
what   = "`$-[i:0]` asks to remove nothing, and that is not an error"
# The VM refused this until step G3, because a count of 0 folded into an end of
# 0 and tripped the `end must be positive` guard. It depended on the start:
# `$-[2:0]` passed and `$-[1:0]` did not, which is what folding costs.
src    = """
t(v) {
    <~ [1, 2, 3]$-[1:v]
}
>> t(0) ¶
"""

