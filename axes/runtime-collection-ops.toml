[[cell]]
id     = "update-on-a-string-writes-at-that-position"
expect = "ok"
what   = "a string is an array of characters, and is written into like one"
# Asked for `error` for a few hours on 2026-09-22 (step G4.2), when `zyjs` was
# aligned with the two Rust engines, which refused. The author settled it the
# other way the same day: «todo string es una cadena o arreglo de caracteres y
# en zymbol eso también se mantiene y por eso se ejecuta como un arreglo». So
# `zyjs` was the one that had it right, and the two Rust engines grew the
# write (step G4.3).
src    = """
t(v) {
    v[1]$~ "z"
    <~ v
}
>> t("abc") ¶
"""

