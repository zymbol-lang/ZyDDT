# The runtime-collection-ops axis — Phase C, family C3 of the diagnostics plan.
#
# Every diagnostic below is one the engines define and, on 2026-09-14, no
# program anywhere provoked (`zyquality/messages/reach.py --list ejecución`).
# Each gets the two cells the plan asks for:
#
#   <id>        expect = "error"  the program that raises it
#   <id>-met    expect = "ok"     the same failure inside `!?`, printing the
#                                  `##` family the catch received
#
# The operand that is wrong arrives through a parameter on purpose: written as
# a literal, the analyzer refuses most of these before anything runs, and the
# runtime diagnostic is never reached — which is how they came to be unprovoked.
#
# The `-met` cells print the kind rather than filtering on one. They were
# written when the family was NOT decided — the tree-walker answered `##_` and
# the VM `##Type` — and a cell that filtered on a guess would have encoded the
# guess. It is decided now (D1, 2026-09-15): a wrong TYPE is `##Type` and a
# wrong VALUE is `##Index`, and the three engines were aligned on it in step 4.1
# (GLB-044). Printing the kind is still what these cells do, because what they
# are for is the comparison and not the filter.
#
# Three diagnostics of this family have no cell because nothing can reach them;
# their reasons are in zyquality/messages/queue/runtime.tsv:
#   · cannot update {:?} during deep update
#   · deep update ($~) does not support ranges in the path
#   · update operator ($~) requires a place to write like …

id      = "runtime-collection-ops"
what    = "the runtime diagnostics of the `$` collection operators: that each happens, and how it is met"
engines = ["zytw", "zyvm", "zyjs"]

[[cell]]
id     = "repeat-repetition-count-must-be-an-integer"
expect = "error"
what   = "$* repetition count must be an integer, got {}"
src    = """
t(v) {
    <~ "ab" $* v
}
>> t("x") ¶
"""

[[cell]]
id     = "repeat-repetition-count-must-be-an-integer-met"
expect = "ok"
what   = "and inside `!?` it is met, with the family the catch received"
src    = """
t(v) {
    <~ "ab" $* v
}
!? {
    >> t("x") ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

