# The type-change axis — the reassignment warning, and how far each engine
# infers the right-hand side to decide it.
#
# Until 2026-09-24 the browser engine decided it only literal against literal,
# so `marca = "@"` then `marca = trazo[1]` — String then Char — was flagged by
# both Rust engines and passed in silence there, in the 110 mandelbrot examples.
# Decided: infer the six shapes the Rust type checker infers (GLB-043).
#
# The warning has a real basis: a one-character String and a Char print the
# same, but `"@" == '@'` is FALSE in all three engines. A name that is sometimes
# one and sometimes the other can fail a comparison without a sign.
#
# Each warning cell reassigns a String to something inferred as another type;
# the `ok` cells are the controls — the places Rust stays silent, and must go on
# staying silent, because a warning that fires where nothing changed is the
# failure this axis exists to prevent.

id      = "type-change"
what    = "a reassignment to another type warns, and each engine infers the right-hand side alike"
engines = ["zytw", "zyvm", "zyjs"]
expect  = "warn"

[[cell]]
id   = "literal"
what = "String, then an Int literal"
src  = """
x = "a"
x = 5
>> x ¶
"""

[[cell]]
id   = "variable"
what = "String, then a variable holding an Int — decided from what the variable holds"
src  = """
x = "a"
y = 5
x = y
>> x ¶
"""

[[cell]]
id   = "string-index-is-a-char"
what = "String, then one position of a String — a Char (the mandelbrot shape)"
src  = """
trazo = " .:-="
marca = "@"
marca = trazo[1]
>> marca ¶
"""

[[cell]]
id   = "arithmetic"
what = "String, then arithmetic — an Int"
src  = """
x = "a"
x = 1 + 2
>> x ¶
"""

[[cell]]
id   = "call"
what = "String, then a call — the type the function's `<~` returns"
src  = """
f() { <~ 5 }
x = "a"
x = f()
>> x ¶
"""

[[cell]]
id   = "length"
what = "String, then `$#` — an Int"
src  = """
x = "a"
x = "abc"$#
>> x ¶
"""

[[cell]]
id     = "int-then-float-is-no-change"
expect = "ok"
what   = "Int, then Float: numbers stay compatible, as in Rust"
src    = """
x = 1
x = 1.5
>> x ¶
"""

[[cell]]
id     = "call-returning-two-types-stays-silent"
expect = "ok"
what   = "a function returning Int on one path and String on another is Any: cannot tell, so nothing is said"
src    = """
f(a) {
    ? a > 0 { <~ 1 }
    <~ "neg"
}
x = 1
x = f(1)
>> x ¶
"""

[[cell]]
id     = "same-type-through-a-call"
expect = "ok"
what   = "Int, then a call returning Int: nothing changed"
src    = """
f() { <~ 5 }
x = 1
x = f()
>> x ¶
"""

[[cell]]
id   = "loop-iterator"
what = "String, then the iterator of a range, which is an Int"
# ZYJS-034, open: both Rust engines warn; zyjs does not know an iterator of a
# range is an Int, while it warns for a literal or a variable in the same loop.
src  = """
x = "a"
@ i:1..2 {
    x = i
}
>> x ¶
"""

# ── Unit is the absence of a value, not a type (GLB-043, decided 2026-09-25) ──
#
# Emptying a variable with `##_`, or filling one that started empty, does not
# warn. A change of type is judged against the last type that was not Unit, so
# `x = 1`, `x = ##_`, `x = "a"` still warns Int -> String, while every other
# check keeps seeing what the name holds now: Unit.

[[cell]]
id     = "unit-empties-a-variable"
expect = "ok"
what   = "`x = ##_` over an Int does not warn"
src    = """
x = 1
x = ##_
>> x ¶
"""

[[cell]]
id     = "unit-starts-a-variable-empty"
expect = "ok"
what   = "a variable born `##_` and then given an Int does not warn"
src    = """
x = ##_
x = 1
>> x ¶
"""

[[cell]]
id     = "unit-empties-and-refills-in-a-loop"
expect = "ok"
what   = "a «last seen» that starts empty and is emptied again"
src    = """
ultimo = ##_
@ i:1..4 {
    ultimo = i
    ? i == 2 {
        ultimo = ##_
    }
}
>> ultimo ¶
"""

[[cell]]
id   = "a-change-across-unit-still-warns"
what = "Int, emptied, then String: judged against the Int"
src  = """
x = 1
x = ##_
x = "a"
>> x ¶
"""

[[cell]]
id   = "a-condition-on-an-emptied-variable"
what = "the condition check still sees Unit, not the Int it held"
# Not a type change: kept here because it is the other half of the rule — the
# emptied name is Unit for every check but this one. ZYJS-036, open: zyjs gives
# no condition warning for a name that holds Unit.
src  = """
x = 1
x = ##_
? x {
    >> "si" ¶
}
"""

[[cell]]
id     = "a-function-local-is-not-the-file-name"
expect = "ok"
what   = "a function's own `x` is compared with nothing outside it (MEM-2)"
# GLB-058, open: both Rust engines warn `'x' was String but assigned Int`,
# comparing the function's local with the file's `x`. zyjs does not.
src    = """
x = "s"
f() {
    x = 1
    <~ x
}
>> f() ¶
>> x ¶
"""

# ── A type change inside a block, seen from after it (added 2026-10-05) ─────
#
# The same as runtime-operators/arithmetic-after-a-block-assigned-the-name, on
# the type-change warning: after `? #1 { x = "a" }` the Rust analyser believed
# `x` was an Int again. Decided 2026-10-05 (GLB-092): both changes warn. And
# through a lambda, which writes a copy (MEM-6), the name outside keeps its type.

[[cell]]
id   = "type-change-after-a-block-changed-it"
what = "`x = 1`, `? #1 { x = \"a\" }`, `x = 2.5`: two changes, two warnings (Int → String, String → Float) (GLB-092)"
src  = """
x = 1
? #1 {
    x = "a"
}
x = 2.5
>> x ¶
"""

[[cell]]
id   = "type-change-inside-a-lambda-stays-in-it"
what = "`x = 1`, a lambda that does `x = \"a\"`, then `x = 2.5`: one warning — the lambda changed a copy, so `x` outside is still an Int (GLB-092, MEM-6)"
src  = """
x = 1
f = () -> {
    x = "a"
    <~ x
}
x = 2.5
>> f() x ¶
"""

# ── Changes the browser engine does not see (added 2026-10-05) ──────────────
#
# Measured while sizing GLB-092: the type-change warning of zyjs read only
# scalar types, so a change to or from a collection passed in silence there.
# Corrected 2026-10-05 (GLB-093): it names collections as Rust does. Its other
# face — a module's own state changed inside one of its functions — is visible
# only to `zymbol check` of the module file itself, which a cell cannot ask: a
# cell runs, and a module cannot be run, while running its importer shows
# neither engine's warnings for the module.

[[cell]]
id   = "type-change-to-a-collection"
what = "`x = 'c'` then `x = (1, 2)`: a Char that becomes a tuple warns, in both analysers (GLB-093)"
src  = """
x = 'c'
x = (1, 2)
>> x ¶
"""

# ── A function reassigned: compared part by part (added 2026-10-07) ─────────
#
# The type-change relation compared a function whole, while an argument and an
# element compare it part by part, so `f = (a) -> a` then `f = (b) -> b * 2`
# warned `(Any) -> Any` against `(Any) -> Int` — the same two values that are
# no mix as the elements of an array. GLB-100, decided 2026-10-07: part by part
# here too — the same arity, and each parameter and the return compatible.

[[cell]]
id     = "function-of-one-shape-is-not-a-change"
expect = "ok"
what   = "`f = (a) -> a`, then `f = (b) -> b * 2`: `(Any) -> Any` and `(Any) -> Int` are one function (GLB-100)"
src    = """
f = (a) -> a
f = (b) -> b * 2
>> f(2) ¶
"""

[[cell]]
id     = "function-returning-an-empty-array-is-not-a-change"
expect = "ok"
what   = "`() -> [Int]`, then `() -> []`: an array of `Any` fits any array inside a function too (GLB-100)"
src    = """
f = () -> [1]
f = () -> []
>> f() ¶
"""

[[cell]]
id   = "function-returning-another-type-is-a-change"
what = "the control: `() -> Int`, then `() -> String`, is a change of type (GLB-100)"
src  = """
f = () -> 1
f = () -> "s"
>> f() ¶
"""

[[cell]]
id   = "function-of-another-arity-is-a-change"
what = "the control: `(Any) -> Any`, then `(Any, Any) -> Any`, is a change of type (GLB-100)"
src  = """
f = (a) -> a
f = (a, b) -> a
>> f(1, 2) ¶
"""


# ── A tuple, a dictionary or a nested array reassigned (added 2026-10-07) ───
#
# Measured beside GLB-100: the relation compares these whole, so an `Any` or an
# Int/Float inside is a change of type, while an argument and an element compare
# them part by part. With an `Any` inside, the engines also disagree: Rust warns,
# zyjs does not name the tuple and is silent (GLB-104, undecided).

[[cell]]
id   = "tuple-with-an-unknown-part"
what = "`t = (1, id(2))`, then `t = (1, \"a\")`: Rust warns `(Int, Any)` → `(Int, String)`, zyjs does not (GLB-104)"
src  = """
id(v) { <~ v }
t = (1, id(2))
t = (1, "a")
>> t ¶
"""
open_finding = "GLB-104"

[[cell]]
id   = "dictionary-with-an-unknown-value"
what = "`d = #(k: id(1))`, then `d = #(k: \"a\")`: Rust warns `#(k: Any)` → `#(k: String)`, zyjs does not (GLB-104)"
src  = """
id(v) { <~ v }
d = #(k: id(1))
d = #(k: "a")
>> d ¶
"""
open_finding = "GLB-104"
