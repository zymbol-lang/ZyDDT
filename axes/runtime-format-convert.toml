# The runtime-format-convert axis — Phase C, family C5 of the diagnostics plan.
#
# Casts (`###`, `##!`), base conversion (`0x|x|`) and the format expressions
# (`#.n|x|`, `#!n|x|`, `#,|x|`): the runtime diagnostics no program provoked on
# 2026-09-14. `<id>` raises it, `<id>-met` catches it and prints the family. The
# wrong value arrives through a parameter so the analyzer lets the program run.
#
# `0x|"zz"|` is one program with two diagnostics, one per Rust engine:
# `failed to parse 'zz' as hexadecimal number` in the tree-walker and
# `failed to parse 'zz' as base-16 number` in the VM. One cell holds both.

id      = "runtime-format-convert"
what    = "the runtime diagnostics of casts, base conversion and format expressions: that each happens, and how it is met"
engines = ["zytw", "zyvm", "zyjs"]

[[cell]]
id     = "trunc-cast-requires-a-numeric-value-or"
expect = "error"
what   = "##! requires a numeric value or Char, got {}"
src    = """
t(v) {
    <~ ##!v
}
>> t("x") ¶
"""

[[cell]]
id     = "trunc-cast-requires-a-numeric-value-or-met"
expect = "ok"
what   = "and inside `!?` it is met, with the family the catch received"
src    = """
t(v) {
    <~ ##!v
}
!? {
    >> t("x") ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

[[cell]]
id     = "int-cast-requires-a-numeric-value-got"
