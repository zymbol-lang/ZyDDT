# The syntax-modules axis — Phase B, family B13 of the diagnostics plan.
#
# A module file written wrong: the parser diagnostics no program provoked on
# 2026-09-14. Each cell imports one broken module, written beside it with
# `[cell.files]`, and expects `error`. reach.py also checks the module file on
# its own, which is where its diagnostic appears as a line of its own; when it
# is imported, the engines report it inside `failed to parse module`.
#
# Every module is named like its file, so the only thing wrong with it is the
# thing the cell asks about (E001 would otherwise join in).
#
# Three lines have no cell (reasons in the queue): the checks that a module
# starts with `#`, an export block with `#>` and an import with `<#`, whose
# callers have already dispatched on exactly that token.

id      = "syntax-modules"
what    = "the parser diagnostics of module files: each form refused, with its help"
engines = ["zytw", "zyvm", "zyjs"]
expect  = "error"

[[cell]]
id   = "const-not-literal"
what = "E013: constant initializer in module must be a literal — with its help"
src  = """
<# ./m/const_not_literal => md
>> "x" ¶
"""
[cell.files]
"m/const_not_literal.zy" = """
# const_not_literal {
    #> { C }
    C := 1 + 2
}
"""

[[cell]]
id   = "variable-not-literal"
what = "E013: variable initializer in module must be a literal — with its help"
src  = """
<# ./m/variable_not_literal => md
>> "x" ¶
"""
[cell.files]
"m/variable_not_literal.zy" = """
# variable_not_literal {
    #> { f }
    x = 1 + 2
    f() {
        <~ x
    }
}
"""

[[cell]]
id   = "two-export-blocks"
what = "duplicate export block in module — with its help"
src  = """
<# ./m/two_export_blocks => md
>> "x" ¶
"""
[cell.files]
"m/two_export_blocks.zy" = """
# two_export_blocks {
    #> { f }
    #> { f }
    f() {
        <~ 1
    }
}
"""

[[cell]]
id   = "import-without-arrow"
what = "expected '=>' for module alias"
src  = """
<# ./m/import_without_arrow => md
>> "x" ¶
"""
[cell.files]
"m/import_without_arrow.zy" = """
# import_without_arrow {
    <# std/math mat
    #> { f }
    f() {
        <~ 1
    }
}
"""

[[cell]]
id   = "module-without-brace"
