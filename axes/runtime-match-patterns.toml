# ── A top-level `<~` inside a `??` that gives a value (added 2026-10-07) ────
#
# Measured beside ZYVM-011. A top-level `<~` ends the program and its value is
# the exit status: alone, and inside a `??` statement, the three engines exit
# with it. Inside a `??` whose value is used, the VM still does; the tree-walker
# went on with the `??` worth Unit, and zyjs failed with `Runtime error: [object
# Object]` (GLB-107, corrected 2026-10-07: the signal leaves the expression in
# the tree-walker, and a statement takes a thrown one in zyjs). The same
# unwinding serves a `<~` inside a function and an `@!` inside a loop — the
# three cells after the first two. The first two gained a `_ => 0` arm that
# never runs on 2026-10-24, when a `??` without `_` began to be warned (G5):
# what they ask is the `<~`, and an `ok` is what they assert.

