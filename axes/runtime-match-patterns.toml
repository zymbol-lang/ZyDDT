# ── A `??` statement no arm matches (added 2026-10-06) ──────────────────────
#
# Measured beside GLB-101: as a value (`r = ?? 2 { 1 => "uno" }`) all three
# engines fail with `no pattern matched in match expression`; written as a
# statement, zyjs went on to the next line, and only the Rust engines failed.
# ZYJS-051, corrected 2026-10-07: zyjs fails there too. A block arm, so nothing
# warns about a discarded value; `-met` holds the family the catch receives.
# The VM gave the line of the last statement in an arm, the other two the line
# of the `??` — the line of the statement, the rule of every runtime error
# (ZYVM-011, corrected 2026-10-07). The cells after `-met` are the forms the VM
# also placed wrong: a value with a block arm, a `?` inside an arm, a loop.

[[cell]]
id     = "match-statement-no-arm-matches"
