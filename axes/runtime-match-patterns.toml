# ── What a pattern is: the three engines accept and refuse the same ones ────
#
# Found by G5's probes on 2026-10-24. A pattern is one token — two with a sign —
# or a range between two Int literals or two Char literals, a list of those, a
# comparison, `_`, a name or an error kind; that is the Rust grammar, and the
# language. The VM did not compile a Char range (ZYVM-032); zyjs read a pattern
# as an expression and ran `1 + 2 =>`, `f(3) =>`, `[1 + 2] =>`, Float, String
# and variable ranges and a `_? cond =>` guard (ZYJS-070), and checked no
# pattern's type against the scrutinee's (ZYJS-071); and both Rust analysers
# refused a comparison on a parameter inferred as a number (GLB-149).

[[cell]]
id     = "char-range-pattern"
expect = "ok"
what   = "`'a'..'z' =>` and `'A'..'Z' || '0'..'9' =>` classify characters, and a Char range against an Int is a run-time `##Type` — the VM refused to compile the program (ZYVM-032)"
src    = """
clase(c) {
    <~ ?? c {
        'a'..'z' => 1
        'A'..'Z' || '0'..'9' => 2
        _ => 3
    }
}
t = 0
@ c:"qM7-az" { t = t * 10 + clase(c) }
>> t ¶
!? { >> clase(5) ¶ } :! { >> (_err#?)[1] ¶ }
"""
oracle.py = """
def clase(c):
    if 'a' <= c <= 'z': return 1
    if 'A' <= c <= 'Z' or '0' <= c <= '9': return 2
    return 3
t = 0
for c in "qM7-az": t = t * 10 + clase(c)
print(t)
print("##Type")
"""
oracle_literal_ok = "the second line is the family the catch receives, which names a kind rather than computing one"

