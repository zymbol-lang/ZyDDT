# The loop-jump axis — `@!` and `@>` in every kind of loop.
#
# The header of an `@` decides which loop it is, and each kind is a separate
# branch in every engine: infinite, a count, a condition, a range, a walk over an
# array, a walk over a string. A jump has to be honoured by each branch on its
# own, and a branch that forgets one is invisible to anything that does not ask
# THAT branch THAT jump.
#
# Found the day it was declared, 2026-09-14 (ZYJS-017): in the browser engine an
# `@>` inside a counted loop `@ 3 { }` was handed upwards instead of being taken
# — at the top level the program simply ended, exit status 0, with the rest of it
# unrun; inside a function, the function returned `##_`. The count branch checked
# for `@!` and never for `@>`. Nothing in 666 corpus files writes `@>` inside a
# count. A cell from the `error-flow` axis tripped on it by accident.
#
# Every program runs three turns and jumps on the first, so a jump that is
# ignored, one that is taken as the other, and one that escapes the loop all
# print something different.

id      = "loop-jump"
what    = "`@!` and `@>` taken by every kind of loop, at the top level and inside a function"
engines = ["zytw", "zyvm", "zyjs"]
expect  = "ok"

[[dimension]]
name = "loop"
values = [
  { id = "infinite",       what = "an infinite `@ { }`",          head = '@' },
  { id = "count",          what = "a counted `@ 3 { }`",          head = '@ 3' },
  { id = "condition",      what = "a conditional `@ k < 3 { }`",  head = '@ k < 3' },
  { id = "range",          what = "a range `@ _i:1..3 { }`",      head = '@ _i:1..3' },
  { id = "array",          what = "a walk over an array",         head = '@ _e:[1, 2, 3]' },
  { id = "string",         what = "a walk over a string",         head = '@ _c:"abc"' },
]

[[dimension]]
name = "jump"
values = [
  { id = "break",    what = "`@!`", stmt = '@!' },
  { id = "continue", what = "`@>`", stmt = '@>' },
]

[[dimension]]
name = "site"
values = [
  { id = "top",      what = "at the top level", open = 'k = 0', close = '>> "sigue" ¶' },
  { id = "function", what = "inside a function", open = "f() {\n    k = 0", close = "    <~ k\n}\n>> f() ¶\n>> \"sigue\" ¶" },
]

[matrix]
id   = "«loop.id»-«jump.id»-«site.id»"
what = "«jump.what» on the first turn of «loop.what», «site.what»"
src  = """
«site.open»
«loop.head» {
    k += 1
    ? k == 1 { «jump.stmt» }
    >> "vuelta " k ¶
    ? k == 3 { @! }
}
>> "después " k ¶
«site.close»
"""
