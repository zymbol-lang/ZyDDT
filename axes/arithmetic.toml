# The arithmetic axis — where agreement is not enough.
#
# Three engines agreeing about `6 * 7` is worth very little: they agree because
# two of them share a front end and the third was ported from it.  A wrong
# answer they all inherited is a green row.
#
# So every cell here carries an ORACLE: the same computation in Python, whose
# answer was authored outside Zymbol entirely.  The engines must agree with each
# other AND with it.  `zyddt axis` reports `WRONG ANSWER` when they agree and the
# oracle says otherwise, which is the one thing a differential can never say.
#
# The oracle is cited only for what it actually decides.  CPython is the
# authority on integer arithmetic; it is NOT an authority on how Zymbol formats
# a dictionary, and a cell that wants that wants a golden instead.

id      = "arithmetic"
what    = "integer and float arithmetic, checked against an implementation that is not ours"
engines = ["zytw", "zyvm", "zyjs"]

[[cell]]
id   = "product"
what = "integer multiplication"
src  = """
>> 6 * 7 ¶
"""
oracle.py = """
print(6 * 7)
"""

[[cell]]
id   = "integer-division"
what = "`/` between two integers truncates toward zero (DI-06)"
# The first draft of this oracle was `print(7 / 2)` and reported WRONG ANSWER
# against all three engines, which were right.  Zymbol's `/` between Ints
# truncates toward zero like C and Go (DI-06: `7/2 → 3`, `-5/2 → -2`); Python 3
# gives a real number and offers `//` separately.
#
# That is the failure mode an oracle has to be written against: it asserts
# ANOTHER language's answer about this one unless somebody writes down which
# rule is being checked.  An oracle written carelessly is a second wrong belief,
# not a check on the first.  The `-5` case is included because truncation and
# flooring only differ on negatives — `7/2` alone cannot tell them apart.
src  = """
>> 7 / 2 ¶
>> (-5) / 2 ¶
"""
oracle.py = """
import math
print(math.trunc(7 / 2))      # toward zero, not floor
print(math.trunc(-5 / 2))     # -2, not -3
"""

[[cell]]
id   = "modulo-negative"
what = "`%` follows the same truncating division (DI-06)"
# Same trap, sharper: `-7 % 3` is -1 in Zymbol and 2 in Python, and neither is
# wrong — Python floors, C truncates, and Zymbol's `%` has to agree with its own
# `/`.  `math.fmod` is the truncating one.
#
# A cell where the oracle needs a comment saying WHICH rule it encodes is a cell
# earning its place: the language had made this decision and nothing executable
# recorded it.
src  = """
>> (-7) % 3 ¶
>> 7 % (-3) ¶
"""
oracle.py = """
import math
print(int(math.fmod(-7, 3)))  # -1: sign follows the dividend
print(int(math.fmod(7, -3)))  #  1
"""

[[cell]]
id   = "i53-boundary"
what = "the largest integer the model allows, reached by a route that stays in range"
# The first version of this cell was a fraud, and it is kept described here
# because the mechanism invites exactly this:
#
#     src       >> 9007199254740991 ¶      ← a LITERAL, chosen knowing the answer
#     oracle    print(2**53 - 1)           ← a COMPUTATION
#
# The two sides do not do the same thing.  Zymbol prints back a constant that
# was typed to match what Python computes, so the "check" confirms only that the
# same number was typed twice.  An oracle is a check when BOTH SIDES COMPUTE, by
# the SAME ROUTE; anything less is self-validation with extra steps.
#
# The route matters as much as the expression.  `2 ^ 53 - 1` cannot be used —
# see the next cell — so both sides reach the boundary the same way, through two
# halves neither of which leaves the range.
src  = """
>> (2 ^ 52) + (2 ^ 52 - 1) ¶
"""
oracle.py = """
print((2**52) + (2**52 - 1))
"""

[[cell]]
id     = "i53-overflow-of-an-intermediate"
what   = "`2 ^ 53 - 1` is refused, because the intermediate leaves the range"
expect = "error"
# NO ORACLE, and the absence is the finding.
#
#     zymbol   >> 2 ^ 53 - 1 ¶     Runtime error: integer overflow: 2 ^ 53
#     python   print(2**53 - 1)    9007199254740991
#
# Neither is wrong.  `^` binds tighter than `-`, so the intermediate is
# 9007199254740992 — outside ±(2^53−1) — and a fail-closed model must refuse it
# even though the subtraction would have brought the result back into range.
# Python has no boundary to cross.
#
# So the two languages do not share a number model at this point, which is the
# whole reason the cell exists, and an oracle here would be asserting Python's
# answer about Zymbol.  `expect = "error"` is the strongest claim that is
# actually true of both: whatever the message, this must not produce a number.
#
# Measured 2026-08-28, identical in all three engines, message included.
#
# ── Is refusing this normal, or is it Zymbol's design? ───────────────────────
# Both.  It is a deliberate choice, and real languages sit at every point of the
# spectrum.  Measured 2026-08-28, each in its own runtime:
#
#   Zymbol        2 ^ 53 - 1        refused: `integer overflow: 2 ^ 53`
#   Rust (debug)  2i64.pow(63)      panic: attempt to exponentiate with overflow
#   Rust (release)                  wraps, silently
#   C signed                        undefined behaviour
#   C unsigned    2^64 then -1      0, then 18446744073709551615 — the RIGHT
#                                   answer, reached by wrapping TWICE.  Luck,
#                                   not soundness: `2^64 / 2` gives 0.
#   Java                            wraps, silently
#   JavaScript    2**53 - 1         9007199254740991 — works
#   Python        2**53 - 1         9007199254740991 — no boundary at all
#
# Zymbol sits with Rust-in-debug, at the strict end.  Nothing here is unusual;
# what is unusual is how many of the others are silently wrong instead.
#
# The sharp part: Zymbol is STRICTER THAN THE ENGINE THAT MOTIVATED ITS BOUND.
# JavaScript computes `2**53` happily — it is an exact f64 (9007199254740992).
# MAX_SAFE_INTEGER is a convention there, not a limit of the type.  And that is
# exactly why the bound exists: measured, `2**53 === 2**53 + 1` is **true** in
# JavaScript.  Past the safe range the arithmetic still answers, and lies.
# Zymbol made the safe range its TYPE and fails on leaving it, which is the more
# honest of the two and the whole point of i53 being fail-closed.
src  = """
>> 2 ^ 53 - 1 ¶
"""

[[cell]]
id     = "i53-literal-out-of-range"
what   = "a literal past the boundary is refused before running, not at runtime"
expect = "error"
# The sibling of the cell above, and the distinction is real: the same value
# rejected as a LITERAL is a static error, and rejected as a COMPUTATION is a
# runtime one.  Two different code paths enforce the same boundary, and a cell
# that only covered one would leave the other free to drift.
src  = """
>> 9007199254740992 ¶
"""
