# The runtime-errors axis — every kind of failure, and how it is met.
#
# ── Two shapes, and using the wrong one tests nothing ───────────────────────
#
# Zymbol's failures are not one family. `LLM.md` § 9 states the rule and the
# measurement on 2026-09-14 confirms it:
#
#   RAISED    ##Type, ##Div, ##Index, ##Range, ##Key — a mistake in the program.
#             Met with `!? { … } :! ##Kind { … }`.
#   SOFT      ##Parse, ##DB, ##Time, ##IO, ##Network — the world did not
#             cooperate. They come back AS A VALUE: `$!` answers `#1` and `#?`
#             names the kind. A `:!` never sees them, because nothing was thrown.
#
# Of the soft kinds, `##Parse` is also RAISED, by an operator that cannot read a
# text as a number — `0d|"abc"|`, and `"a" < 10` since GLB-094 (2026-10-06) —
# and that one a `:!` does meet. The rule above is about what the standard
# modules return, which is where those five kinds come from.
#
# So a cell that wraps `t::of(2026, 13, 45)` in a try/catch proves nothing at
# all: it passes whether or not the error exists, because the catch is never
# entered either way. That is why each kind below is asked in its own shape.
#
# ── Why these four first ────────────────────────────────────────────────────
#
# Of the ten kinds, six had at least one test of being met (##Div 7 files,
# ##Index 4, ##Range 2, ##IO 2, ##Network 1, ##Key 1) and FOUR had none:
# ##Type, ##Parse, ##DB, ##Time. A kind nothing meets is one where a regression
# passes whole and silent.

id      = "runtime-errors"
what    = "each kind of failure: that it happens, and that it can be met"
engines = ["zytw", "zyvm", "zyjs"]

# ── ##Type — raised ─────────────────────────────────────────────────────────

[[cell]]
id   = "type-is-raised"
what = "a native called with the wrong type raises, rather than answering something"
src  = """
<# std/math => m
>> m::sqrt("a") ¶
"""

[[cell]]
id     = "type-is-catchable"
expect = "ok"
what   = "and `:! ##Type` meets it — the half that makes the kind usable"
src    = """
<# std/math => m
!? {
    >> m::sqrt("a") ¶
} :! ##Type {
    >> "type capturado" ¶
}
"""

# ── ##Parse — soft ──────────────────────────────────────────────────────────

[[cell]]
id     = "parse-comes-back-as-a-value"
expect = "ok"
what   = "malformed JSON is a VALUE, testable with `$!`, not something thrown"
# `\{` escapes the brace: an unescaped `{` opens string interpolation, and the
# first draft of this cell measured that instead of the decoder.
src    = """
<# std/json => j
r = j::decode("\\{roto")
>> (r$!) " " (r#?)[1] ¶
"""

# ── ##Time — soft ───────────────────────────────────────────────────────────

[[cell]]
id     = "time-comes-back-as-a-value"
expect = "ok"
what   = "a date that does not exist is a soft ##Time, not a crash"
src    = """
<# std/time => t
d = t::of(2026, 13, 45)
>> (d$!) " " (d#?)[1] ¶
"""

# ── ##DB — soft, and not everywhere ─────────────────────────────────────────

[[cell]]
id     = "db-comes-back-as-a-value"
expect = "ok"
what   = "a connection that cannot be made is a value, so a program can carry on"
# Excluded for zyjs in exclusions.toml: a browser has no ODBC. Same shape as
# BASH_EXEC and SUBSCRIPT — the case stays here and is graded where it can run.
src    = """
<# std/db => d
c = d::connect("odbc", "DSN=no-existe-este")
>> (c$!) " " (c#?)[1] ¶
"""

# ── A catch that does not match must not swallow ────────────────────────────
#
# GLB-010, found by the cell above on 2026-09-14. `:! ##Kind` filters, and an
# error that does not match the filter has not been handled — it has to carry on
# out of the `!?` exactly as if no catch had been written. Under `zyvm` it
# disappears instead, and the program continues with whatever state the failure
# left behind. That is the most expensive shape a defect can take: no output, no
# exit code, no trace.
#
# Two kinds, crossed the other way round, because one of them alone could be met
# by an engine that simply never matches anything.

[[cell]]
id   = "unmatched-catch-propagates-div"
what = "a `##Div` meeting a `:! ##Index` is not handled, and must reach the top"
src  = """
!? {
    >> (1 / 0) ¶
} :! ##Index {
    >> "index" ¶
}
>> "sigue" ¶
"""

[[cell]]
id   = "unmatched-catch-propagates-index"
what = "and the reverse pairing, so this cannot pass by never matching at all"
src  = """
!? {
    a = [1, 2]
    >> a[99] ¶
} :! ##Div {
    >> "div" ¶
}
>> "sigue" ¶
"""

[[cell]]
id     = "a-native-type-error-knows-its-kind"
expect = "ok"
what   = "`_err#?` names ##Type for a native called with the wrong type"
# The second half of GLB-010: zyvm answers ##_ here, which is why `:! ##Type`
# never matched in the first place. A kind that is not carried is a kind nobody
# can filter on.
src    = """
<# std/math => m
!? {
    >> m::sqrt("a") ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

[[cell]]
id     = "propagate-at-top-level"
expect = "error"
what   = "`v$!!` on a soft error outside any function ends the program saying which error ended it — `Runtime error: ##IO(…)` and its line, status 1. The two Rust engines used to say nothing and zyjs wrote `[object Object]` (decided 2026-09-16; ZYJS-027)"
src    = """
<# std/io => io
v = io::read("/no/existe/zz.txt")
>> "antes" ¶
v$!!
>> "después" ¶
"""

# ── The kind of an error that carries a value (added 2026-10-06) ─────────────
#
# An error that does not declare its kind gets it from the words of its message
# (`zymbol_common::errkind`; `errorKindOfMessage` in zyjs). When the message
# carried a value of the program — a text, a key, the keys there are — the
# value's words counted as much as the engine's: `u["overflow"]` was a `##Range`
# in the Rust engines, and `#.2|"index"|` an `##Index` in all three. GLB-097,
# corrected 2026-10-06: those sites declare their kind where they raise — an
# absent key is a `##Key`, and a text read as a number that it is not is a
# `##Parse`, by base conversion, rounding or truncation. One cell per way an
# absent key is reached: each is its own raise site in each engine.

[[cell]]
id     = "missing-key-is-a-key-whatever-its-name"
expect = "ok"
what   = "a key that is not there is a `##Key` even when it is called `overflow` — the Rust engines read `##Range` from the words (GLB-097)"
src    = """
id(v) { <~ v }
u = #(nombre: "x", edad: 3)
!? {
    >> u[id("overflow")] ¶
} :! ##Key {
    >> "Key" ¶
}
"""

[[cell]]
id     = "missing-key-through-the-dot-is-a-key"
expect = "ok"
what   = "`u.overflow`, through the dot: a `##Key` (GLB-097)"
src    = """
u = #(nombre: "x", edad: 3)
!? {
    >> u.overflow ¶
} :! ##Key {
    >> "Key" ¶
}
"""

[[cell]]
id     = "missing-key-removed-is-a-key"
expect = "ok"
what   = "`u$-[\"overflow\"]`, removing a key that is not there: a `##Key` (GLB-097)"
src    = """
id(v) { <~ v }
u = #(nombre: "x", edad: 3)
!? {
    e = u$-[id("overflow")]
    >> e ¶
} :! ##Key {
    >> "Key" ¶
}
"""

[[cell]]
id     = "missing-key-in-a-navigation-is-a-key"
expect = "ok"
what   = "`m[\"a\">\"overflow\"]`, a key missing one step down: a `##Key` (GLB-097)"
src    = """
m = #(a: #(b: 1))
!? {
    >> m["a">"overflow"] ¶
} :! ##Key {
    >> "Key" ¶
}
"""

[[cell]]
id     = "missing-key-in-a-pattern-is-a-key"
expect = "ok"
what   = "`#(overflow: n) = u`, a pattern naming a key that is not there: a `##Key` (GLB-097)"
src    = """
u = #(nombre: "x", edad: 3)
!? {
    #(overflow: n) = u
    >> n ¶
} :! ##Key {
    >> "Key" ¶
}
"""

[[cell]]
id     = "missing-key-is-a-key-whatever-the-other-keys-are"
expect = "ok"
what   = "the message lists the keys that ARE there, and their words count too: `#(overflow: 1)[\"zz\"]` is a `##Range` in Rust (GLB-097)"
src    = """
id(v) { <~ v }
w = #(overflow: 1)
!? {
    >> w[id("zz")] ¶
} :! ##Key {
    >> "Key" ¶
}
"""

[[cell]]
id     = "base-conversion-failure-is-a-parse-whatever-the-text"
expect = "ok"
what   = "`0d|\"type\"|` fails to read the text as a number: a `##Parse`, as `0d|\"abc\"|` is — not the `##Type` its words give (GLB-097)"
src    = """
id(v) { <~ v }
!? {
    >> 0d|id("type")| ¶
} :! ##Parse {
    >> "Parse" ¶
}
"""

[[cell]]
id     = "rounding-a-text-is-a-parse-error"
expect = "ok"
what   = "`#.2|\"abc\"|` reads a text as a number and it is not one: a `##Parse` (GLB-097, decided 2026-10-06; it was a `##_`)"
src    = """
id(v) { <~ v }
!? {
    >> #.2|id("abc")| ¶
} :! ##Parse {
    >> "Parse" ¶
}
"""

[[cell]]
id     = "rounding-a-word-is-a-parse-error"
expect = "ok"
what   = "`#.2|\"index\"|` is a `##Parse` too — not the `##Index` the words of the text gave (GLB-097)"
src    = """
id(v) { <~ v }
!? {
    >> #.2|id("index")| ¶
} :! ##Parse {
    >> "Parse" ¶
}
"""

[[cell]]
id     = "truncating-a-word-is-a-parse-error"
expect = "ok"
what   = "`#!2|\"overflow\"|` is a `##Parse` — not the `##Range` the words of the text gave (GLB-097)"
src    = """
id(v) { <~ v }
!? {
    >> #!2|id("overflow")| ¶
} :! ##Parse {
    >> "Parse" ¶
}
"""

# ── The kind of an error that carries a NAME (added 2026-10-06) ─────────────
#
# The same rule as GLB-097, with a name of the program in the message instead of
# a value. Four of them reach run time in a program `check` accepts, and all
# four take the family of the name's words: `t.index` on a positional tuple is
# an `##Index`, `t.zz` a `##_`. Their kind is undecided (GLB-099), so the cells
# assert only that it is not the one the words give.

[[cell]]
id     = "positional-tuple-read-by-a-name-is-not-an-index"
expect = "ok"
what   = "`t.index` on a positional tuple is refused, and not as an `##Index` — which kind it is is GLB-099's question"
src    = """
id(v) { <~ v }
t = id((1, 2))
!? {
    >> t.index ¶
} :! ##Index {
    >> (1 / id(0)) ¶
} :! {
    >> "refused" ¶
}
"""
open_finding = { zytw = "GLB-099", zyvm = "GLB-099", zyjs = "GLB-099" }

[[cell]]
id     = "dot-on-a-non-dictionary-is-not-an-index"
expect = "ok"
what   = "`x.index` with `x` an Int is refused, and not as an `##Index` — the word is in the guidance, `use d.index` (GLB-099)"
src    = """
id(v) { <~ v }
x = id(5)
!? {
    >> x.index ¶
} :! ##Index {
    >> (1 / id(0)) ¶
} :! {
    >> "refused" ¶
}
"""
open_finding = { zytw = "GLB-099", zyvm = "GLB-099", zyjs = "GLB-099" }

[[cell]]
id     = "use-after-destruction-is-not-an-index"
expect = "ok"
what   = "a name called `index` read after `\\ index` is refused, and not as an `##Index` (GLB-099)"
src    = """
id(v) { <~ v }
index = 5
>> index ¶
\\ index
!? {
    >> index ¶
} :! ##Index {
    >> (1 / id(0)) ¶
} :! {
    >> "refused" ¶
}
"""
open_finding = { zytw = "GLB-099", zyvm = "GLB-099", zyjs = "GLB-099" }

[[cell]]
id     = "missing-subscript-is-not-an-index"
expect = "ok"
what   = "`</ index_type.zy />`, a subscript that is not there, is refused, and not as an `##Index` — the word is in the path (GLB-099)"
src    = """
id(v) { <~ v }
!? {
    r = </ index_type.zy />
    >> r ¶
} :! ##Index {
    >> (1 / id(0)) ¶
} :! {
    >> "refused" ¶
}
"""
open_finding = { zytw = "GLB-099", zyvm = "GLB-099", zyjs = "GLB-099" }

