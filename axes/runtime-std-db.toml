# The runtime-std-db axis — Phase C, family C11 of the diagnostics plan.
#
# std/db has both shapes of failure, and each is asked in its own:
#
#   RAISED  a call whose ARGUMENTS are wrong — a name that is not text, params
#           that are not a tuple, a statement list that is not an array. Raised
#           before any connection is touched. `<id>` + `<id>-met`.
#   SOFT    the database did not cooperate — no such connection, no rows, a
#           transaction already open, a savepoint name that is not an
#           identifier. A ##DB VALUE, tested with `$!`; there is nothing to catch,
#           so there is no `-met`.
#
# The soft messages are never printed as a diagnostic line — they are values —
# so reach.py cannot count them even though these cells produce them.
#
# The cells that need a live connection open SQLite in memory through ODBC
# (`Driver=SQLite3;Database=:memory:;`). zyjs is excluded with STD_DB, as
# runtime-errors already is: a browser has no ODBC.

id      = "runtime-std-db"
what    = "the failures of std/db: raised for wrong arguments, soft for a database that did not cooperate"
engines = ["zytw", "zyvm", "zyjs"]

[[cell]]
id     = "cannot-bind-a-function"
expect = "error"
what   = "db: cannot bind {:?} as a parameter"
src    = """
<# std/db => d
t(v) {
    <~ d::exec("c", "select ?", (v,))
}
>> t(x -> x) ¶
"""

[[cell]]
id     = "cannot-bind-a-function-met"
expect = "ok"
what   = "and inside `!?` it is met, with the family the catch received"
src    = """
<# std/db => d
t(v) {
    <~ d::exec("c", "select ?", (v,))
}
!? {
    >> t(x -> x) ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

[[cell]]
id     = "name-must-be-a-string"
expect = "error"
what   = "db: expected String {}"
src    = """
<# std/db => d
t(v) {
    <~ d::exec(v, "select 1")
}
>> t(5) ¶
"""

[[cell]]
id     = "name-must-be-a-string-met"
expect = "ok"
what   = "and inside `!?` it is met, with the family the catch received"
src    = """
<# std/db => d
t(v) {
    <~ d::exec(v, "select 1")
}
!? {
    >> t(5) ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

[[cell]]
id     = "params-must-be-a-tuple-array-or-scalar"
