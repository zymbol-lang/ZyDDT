[[cell]]
id     = "invalid-savepoint-name-is-soft"
expect = "ok"
what   = "invalid savepoint name '{}' — a ##DB value"
src    = """
<# std/db => d
s = d::savepoint("c", "1mal")
>> (s$!) " " s ¶
"""

[[cell]]
id     = "query-one-no-rows-is-soft"
expect = "ok"
what   = "query_one matched no rows — a ##DB value"
src    = """
<# std/db => d
r = d::connect("c", "Driver=SQLite3;Database=:memory:;")
>> (r$!) ¶
q = d::query_one("c", "select 1 where 1 = 0")
>> (q$!) " " q ¶
"""

[[cell]]
id     = "transaction-already-active-is-soft"
expect = "ok"
what   = "transaction already active (use savepoints to nest) — a ##DB value"
src    = """
<# std/db => d
r = d::connect("c", "Driver=SQLite3;Database=:memory:;")
>> (r$!) ¶
d::begin("c")
b = d::begin("c")
>> (b$!) " " b ¶
"""

[[cell]]
id     = "unknown-connection-is-soft"
expect = "ok"
what   = "unknown connection '{}' — a ##DB value"
src    = """
<# std/db => d
u = d::exec("nadie", "select 1")
>> (u$!) " " u ¶
"""
