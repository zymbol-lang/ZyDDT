what   = "db: params must be a Tuple, Array, or scalar"
src    = """
<# std/db => d
t(v) {
    <~ d::exec("c", "select 1", v)
}
>> t(#(a: 1)) ¶
"""

[[cell]]
id     = "params-must-be-a-tuple-array-or-scalar-met"
expect = "ok"
