# ── An edit whose operand writes the same module state (added 2026-10-10) ───
#
# `datos$+ meter()` where `meter` appends to `datos` too. Decided by the author
# on 2026-10-10 (GLB-115): left to right, in an edit as everywhere else. The
# receiver is read first, so `d$+ f()` is `d = d$+ f()` and what the operand
# wrote is overwritten. The VM and zyjs already answered that; the tree-walker
# evaluated the operand first and edited the state as it then stood — on the
# three operators that had a shortcut, and only on those.

[[cell]]
id     = "edit-whose-operand-writes-the-same-state"
what   = "`datos$+ meter()`, `datos[1]$~ meter()` and `datos$-[meter()]` where `meter` appends to `datos`: the receiver is read before the operand runs, and the operand's write is overwritten (GLB-115)"
expect = "ok"
oracle.py = """
def show(v): print("[" + ", ".join(str(x) for x in v) + "]")
datos = [1, 2, 3]
def meter():
    global datos
    datos = datos + [99]
    return 1
read = list(datos); datos = read + [meter()]
show(datos)
datos = [1, 2, 3]
read = list(datos); v = meter(); read[0] = v; datos = read
show(datos)
datos = [1, 2, 3]
read = list(datos); i = meter(); del read[i - 1]; datos = read
show(datos)
"""
src    = """
<# ./mod/orden => O
O::anexar()
>> O::ver() ¶
O::reiniciar()
O::tocar()
>> O::ver() ¶
O::reiniciar()
O::quitar()
>> O::ver() ¶
"""
[cell.files]
"mod/orden.zy" = """
# orden {
    #> { anexar, tocar, quitar, ver, reiniciar }
    datos = [1, 2, 3]

    meter() {
        datos$+ 99
        <~ 1
    }
    anexar() { datos$+ meter() }
    tocar()  { datos[1]$~ meter() }
    quitar() { datos$-[meter()] }
    ver() { <~ datos }
    reiniciar() { datos = [1, 2, 3] }
}
"""

# What ZYVM-003's fix could not break: an edit of module state that FAILS,
# caught, leaves the state as it was. The VM's edit instructions used to take the
# value out of the register before they validated, which was harmless only while
# the module's slot kept its own copy. Since 2026-10-10 the edit is the only
# owner of the value: every instruction validates before it writes, and a failed
# edit hands the value back to the slot.

[[cell]]
id     = "module-state-after-a-failed-edit"
what   = "an update, a removal, an insertion and a path into a scalar that fail on module state, each caught: the state is unchanged"
expect = "ok"
src    = """
<# ./mod/atom => A
!? { A::tocar_mal() } :! { >> "falla" ¶ }
>> A::ver() ¶
!? { A::quitar_mal() } :! { >> "falla" ¶ }
>> A::ver() ¶
!? { A::insertar_mal() } :! { >> "falla" ¶ }
>> A::ver() ¶
!? { A::camino_mal() } :! { >> "falla" ¶ }
>> A::ver() ¶
"""
[cell.files]
"mod/atom.zy" = """
# atom {
    #> { tocar_mal, quitar_mal, insertar_mal, camino_mal, ver }
    tabla = [10, 20, 30]

    tocar_mal()    { tabla[99]$~ 7 }
    quitar_mal()   { tabla$-[99] }
    insertar_mal() { tabla$+[99] 7 }
    camino_mal()   { tabla[1>2]$~ 7 }
    ver() { <~ tabla }
}
"""

# ── Module state as an output argument (added 2026-10-10) ───────────────────
#
# `tocar(datos<~)` inside the module that owns `datos`. MEM-5 says an output
# parameter comes back modified. The tree-walker and zyjs wrote the result back
# to the module's state; the VM wrote it to the temporary it had loaded the
# state into and lost it, silently (ZYVM-014, corrected 2026-10-10).

[[cell]]
id     = "output-argument-that-is-module-state"
what   = "a function writes its `<~` parameter and the argument is the module's own state: the write reaches the state (ZYVM-014)"
expect = "ok"
src    = """
<# ./mod/pres => P
P::correr()
>> P::ver() ¶
P::correr()
>> P::ver() ¶
"""
oracle.py = """
datos = [1, 2, 3]
def tocar(a): a.append(9)
for _ in range(2):
    tocar(datos)
    print("[" + ", ".join(str(x) for x in datos) + "]")
"""
[cell.files]
"mod/pres.zy" = """
# pres {
    #> { correr, ver }
    datos = [1, 2, 3]

    tocar(a<~) { a$+ 9 }
    correr() { tocar(datos<~) }
    ver() { <~ datos }
}
"""

# Module state passed as output and read directly at the same time: two copies,
# 3 and 4 elements. Everything else passed as `<~` is LENT to its parameter
# since 2026-10-10 (GLB-117); this is the one case that is not, decided as S3 —
# every function of the module can see the original while the call lasts, so
# the parameter works on a copy, written back when the call returns.

[[cell]]
id     = "module-state-read-while-passed-as-output"
premise = "MEM-5"
what   = "inside the callee, the module's state read directly and the `<~` parameter bound to it are two copies: `3 4` (GLB-117, S3)"
expect = "ok"
src    = """
<# ./mod/pres2 => P
P::correr()
"""
[cell.files]
"mod/pres2.zy" = """
# pres2 {
    #> { correr }
    datos = [1, 2, 3]

    tocar(a<~) {
        a$+ 9
        >> datos$# " " a$# ¶
    }
    correr() { tocar(datos<~) }
}
"""

# ── A tuple held as module state does not change either (added 2026-10-10) ──
#
# A positional tuple is not edited in place: `t$+ 4` as a statement is refused,
# and `u = t$+ 4` builds. The VM made that check on the receiver's REGISTER, and
# module state has none — so inside a module every editing operator but `$~`
# went through and the tuple grew (ZYVM-016, corrected the day it was found).
# The oracle says what each line must print; three engines that all let the
# edit through would agree with each other.

[[cell]]
id     = "tuple-held-as-module-state-is-not-edited"
what   = "`t$+ v`, `t$-[i]`, `t$- v`, `t$-- v`, `t$+[i] v`, `t$++ a b`, `t[i]$~ v` and `t$-[a..b]` on a tuple that is module state: each refused, the tuple unchanged; `u = t$+ 4` builds (ZYVM-016)"
expect = "ok"
src    = """
<# ./mod/fija => F
F::probar()
"""
oracle.py = """
for _ in range(8):
    print("refused")
print("(1, 2, 3)")
print("(1, 2, 3, 4) (1, 2, 3)")
"""
[cell.files]
"mod/fija.zy" = """
# fija {
    #> { probar }
    t = (1, 2, 3)

    probar() {
        !? {
            t$+ 4
            >> "edited" ¶
        } :! { >> "refused" ¶ }
        !? {
            t$-[1]
            >> "edited" ¶
        } :! { >> "refused" ¶ }
        !? {
            t$- 1
            >> "edited" ¶
        } :! { >> "refused" ¶ }
        !? {
            t$-- 1
            >> "edited" ¶
        } :! { >> "refused" ¶ }
        !? {
            t$+[1] 0
            >> "edited" ¶
        } :! { >> "refused" ¶ }
        !? {
            t$++ 7 8
            >> "edited" ¶
        } :! { >> "refused" ¶ }
        !? {
