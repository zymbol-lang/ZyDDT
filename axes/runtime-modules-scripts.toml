[[cell]]
id     = "subscript-with-warnings-that-fails"
what   = "a subscript that has warnings and then fails: the VM runs it as a process and passes its whole stderr on, warnings included, into the error and into `_err`; the tree-walker runs it in-process and reports the failure alone. Asks only that the engines agree (found in step 3.3, 2026-09-16; GLB-017 I)"
src    = """
r = "?"
!? {
    r = </ ./sub/avisa.zy />
} :! {
    >> "[" _err "]" ¶
}
"""
[cell.files]
"sub/avisa.zy" = """
aviso = 5
x = 1 / 0
"""

[[cell]]
id     = "dot-call-of-a-function-the-module-does-not-export"
expect = "error"
what   = "`m.nada()` on a module that does not export `nada`"
# ZYJS-040, open: both Rust engines say `module 'm' does not export function
# 'nada'`; zyjs reads the dot as a constant: `Module 'm' has no constant …`.
src    = """
<# ./m/saludo => m
>> m.nada() ¶
"""
[cell.files]
"m/saludo.zy" = """
# saludo {
    #> { saluda }
    saluda() { <~ "hola" }
}
"""

[[cell]]
id     = "dot-read-of-a-constant-the-module-does-not-have"
expect = "error"
what   = "`m.nada` read: `Module 'm' has no constant 'nada'` in all three"
# ZYVM-008, open: the VM refuses it before running (`error:`), the tree-walker
# and zyjs while running (`Runtime error:`).
src    = """
<# ./m/saludo => m
>> m.nada ¶
"""
[cell.files]
"m/saludo.zy" = """
# saludo {
    #> { saluda }
    saluda() { <~ "hola" }
}
"""
