id     = "subscript-path-with-a-quote-is-only-a-path"
expect = "error"
what   = "a `\"` and a `;` in the path are part of the file name: nothing reaches a shell"
src    = """
x = </ ./a";echo INYECTADO;"b.zy />
>> x ¶
"""
