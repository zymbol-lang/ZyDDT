[[cell]]
id     = "unexported-function-as-an-error-value"
expect = "error"
what   = "a call to a function the module does not export cannot be caught: it is refused before the program runs"
# ZYVM-008, decided 2026-09-26. This cell used to ask for the text `_err`
# carried when `!?` caught the call; a refusal made before running reaches no
# `!?`, in any engine.
src    = """
<# ./m/ok => o
!? {
    >> o::priv() ¶
} :! {
    >> _err ¶
}
"""
[cell.files]
"m/ok.zy" = """
# ok {
    #> { f }
    f() {
        <~ 1
    }
    priv() {
        <~ 2
    }
}
"""

