# The runtime-modules-scripts axis — Phase C, family C9 of the diagnostics plan.
#
# Loading a module that does not compile, a sub-script that fails, a shell
# command given a function, an unexported function reached as a value: the
# runtime diagnostics no program provoked on 2026-09-14. `<id>` raises it,
# `<id>-met` catches it and prints the family.
#
# The three module-load failures have NO `-met` cell, and cannot: an import must
# come before any statement (E013), so there is no `!?` to put it in.
#
# `</ file />` and `<\ shell \>` are excluded for zyjs in exclusions.toml with
# the tags that already existed, SUBSCRIPT and BASH_EXEC.
#
# Five of this family have no cell (reasons in the queue): `Module '{}' not
# loaded` (an alias is only registered after its module loads), both texts of
# `ConstantNotExported` and `circular dependency detected` (variants declared
# and never constructed), and `failed to run` (a shell that was found and then
# could not start). A sixth, `lexer errors: {0}`, belongs to `zymbol fmt`.

id      = "runtime-modules-scripts"
what    = "the runtime diagnostics of modules, sub-scripts and shell commands: that each happens, and how it is met"
engines = ["zytw", "zyvm", "zyjs"]

[[cell]]
id     = "bash-function-interpolation"
