[[cell]]
id     = "unexported-function-as-an-error-value"
expect = "ok"
what   = "function '{}' not exported from module '{}' — the text `_err` carries when the call is caught"
src    = """
<# ./m/ok => o
!? {
    >> o::priv() ¶
} :! {
    >> _err ¶
}
"""
[cell.files]
"m/ok.zy" = """
# ok {
    #> { f }
    f() {
        <~ 1
    }
    priv() {
        <~ 2
    }
}
"""

[[cell]]
id     = "undefined-module-alias"
expect = "error"
what   = "undefined module alias: '{}'"
src    = """
t(v) {
    <~ v.f(1)
}
>> t(5) ¶
"""

[[cell]]
id     = "undefined-module-alias-met"
expect = "ok"
what   = "and inside `!?` it is met, with the family the catch received"
src    = """
t(v) {
    <~ v.f(1)
}
!? {
    >> t(5) ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

[[cell]]
id     = "module-with-lexer-errors"
expect = "error"
what   = "{} lexer error(s) in '{}'"
src    = """
<# ./m/lexico => b
>> b::f() ¶
"""
[cell.files]
"m/lexico.zy" = """
# lexico {
    #> { f }
    f() {
        <~ "abc
    }
}
"""

