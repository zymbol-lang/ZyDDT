[[cell]]
id     = "variable-that-shares-an-alias-name-is-not-a-module"
expect = "ok"
what   = "a local `m` hides the alias `m`, so `m.x` reads the dictionary"
src    = """
<# ./m/saludo => m
f() {
    m = #(x: 7)
    <~ m.x
}
>> f() ¶
"""
[cell.files]
"m/saludo.zy" = """
