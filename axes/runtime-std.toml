# The runtime-std axis — Phase C, family C10 of the diagnostics plan.
#
# The HARD errors of std/io, std/json, std/math, std/net, std/random, std/term
# and std/time: a native called with an argument of the wrong type or outside
# its domain, which raises rather than coming back as a soft error value. The
# runtime diagnostics no program provoked on 2026-09-14. `<id>` raises it,
# `<id>-met` catches it and prints the family.
#
# `time::of` has both kinds and they are easy to confuse: `tm::of("x")` is a
# SOFT ##Time (a trailing String is the zone, and no numbers is a bad date), and
# `tm::of(1.5, 1, 1)` is the HARD refusal this cell asks for.
#
# `unknown builtin id` has no cell: the compiler assigns builtin ids from the
# same table the VM dispatches on.

id      = "runtime-std"
what    = "the hard errors of the std modules: that each happens, and how it is met"
engines = ["zytw", "zyvm", "zyjs"]

[[cell]]
id     = "io-delete-expected-string-path"
expect = "error"
what   = "io::delete: expected String path"
src    = """
<# std/io => io
t(v) {
    <~ io::delete(v)
}
>> t(5) ¶
"""

[[cell]]
id     = "io-delete-expected-string-path-met"
expect = "ok"
what   = "and inside `!?` it is met, with the family the catch received"
src    = """
<# std/io => io
t(v) {
    <~ io::delete(v)
}
!? {
    >> t(5) ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

