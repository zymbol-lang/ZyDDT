# The runtime-index-nav axis — Phase C, family C4 of the diagnostics plan.
#
# Indexing, navigation (`>`), dictionary addressing and the destructuring
# pattern: the runtime diagnostics no program provoked on 2026-09-14. Same shape
# as runtime-collection-ops: `<id>` raises it, `<id>-met` catches it and prints
# the family. The wrong value arrives through a parameter so the analyzer lets
# the program run; a navigation step with a float is passed as a VARIABLE,
# because `v[1>1.5]` is refused by the parser and `v[1.5>1]` reads as `1.5 > 1`.
#
# Four diagnostics of this family have no cell because nothing reaches them;
# the reasons are in zyquality/messages/queue/runtime.tsv.

id      = "runtime-index-nav"
what    = "the runtime diagnostics of indexing, navigation and dictionary addressing: that each happens, and how it is met"
engines = ["zytw", "zyvm", "zyjs"]

[[cell]]
id     = "a-string-navigation-step-addresses-a-dictionary"
expect = "error"
what   = "a String addresses a dictionary key, and this is [Int] — the same words through `v[\"k\"]` and through `v[1>\"k\"]` (step 3.5b, decided 2026-09-16)"
src    = """
t(v) {
    <~ v[1>"a"]
}
>> t([[1, 2]]) ¶
"""

[[cell]]
id     = "a-string-navigation-step-addresses-a-dictionary-met"
expect = "ok"
what   = "and inside `!?` it is met, with the family the catch received"
src    = """
t(v) {
    <~ v[1>"a"]
}
!? {
    >> t([[1, 2]]) ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

