expect = "error"
what   = "ranges can only be used in for-each loops"
src    = """
t(v) {
    <~ v..3
}
>> t(1) ¶
"""

[[cell]]
id     = "ranges-can-only-be-used-in-for-met"
expect = "error"
what   = "and `!?` does NOT meet it: a static refusal is not an error value"
# Asked for `ok` until D4 landed (F5, 2026-09-21), when a range outside a
# for-each loop became a STATIC error in all three analyzers. A static refusal
# happens before anything runs, so there is no `!?` to catch it and no `##`
# family to print. The `-met` question only has an answer for a refusal that
# happens at RUN time.
src    = """
t(v) {
    <~ v..3
}
!? {
    >> t(1) ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

