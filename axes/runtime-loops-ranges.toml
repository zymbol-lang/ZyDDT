what   = "and inside `!?` it is met, with the family the catch received"
# `@ i:a..b` refuses at RUN time — `check` passes it — so `!?` does meet it,
# and all three answer `##Type`. `warn` and not `ok` because a range whose
# bound comes from a variable also raises "range direction is decided at
# runtime", which is the whole reason this cell asked for `warn` before it was
# reaimed. (Its `@ (patrón):` spelling met nothing: that one is static since
# D4, which is why this cell briefly asked for `error` earlier in step G2.)
src    = """
