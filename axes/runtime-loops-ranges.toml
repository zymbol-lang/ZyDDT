[[cell]]
id     = "range-bounds-must-be-integers-end"
expect = "error"
what   = "range bounds must be integers, got {} and {} — the END is not one"
# Was `@ (a, b):1..v` and asked for `range end must be an integer, got {:?}`.
# That text stopped being reachable when D4 (F5) made `@ (patrón):rango` a
# static error: the cell stayed green while measuring `tuple pattern '( … )'
# requires a tuple`, which `runtime-match-patterns` already owns, and the
# message that a bad bound really produces was measured by nobody. Reaimed
# 2026-09-22 (step G2) at `@ i:`, the form that reaches it. The dead
# tree-walker sites it used to name are gone — ZYTW-006.
src    = """
t(v) {
    @ i:1..v {
        >> i ¶
    }
    <~ 1
}
>> t(1.5) ¶
"""

[[cell]]
id     = "range-bounds-must-be-integers-end-met"
expect = "warn"
what   = "and inside `!?` it is met, with the family the catch received"
# `@ i:a..b` refuses at RUN time — `check` passes it — so `!?` does meet it,
# and all three answer `##Type`. `warn` and not `ok` because a range whose
# bound comes from a variable also raises "range direction is decided at
# runtime", which is the whole reason this cell asked for `warn` before it was
# reaimed. (Its `@ (patrón):` spelling met nothing: that one is static since
# D4, which is why this cell briefly asked for `error` earlier in step G2.)
src    = """
t(v) {
    @ i:1..v {
        >> i ¶
    }
    <~ 1
}
!? {
    >> t(1.5) ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

