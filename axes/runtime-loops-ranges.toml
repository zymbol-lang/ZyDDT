# The runtime-loops-ranges axis — Phase C, family C6 of the diagnostics plan.
#
# Ranges, steps, the sleep `@~`, and what a loop may iterate: the runtime
# diagnostics no program provoked on 2026-09-14. `<id>` raises it, `<id>-met`
# catches it and prints the family. Two diagnostics of the tree-walker's range
# evaluation are only reached through a DESTRUCTURING loop, `@ (a, b):1..v`:
# the plain `@ i:a..b` has a fast path of its own (loops.rs) with its own text.
#
# Three `-met` cells expect `warn`, not `ok`: a bound that arrives through a
# variable makes the analyzer say "range direction is decided at runtime", which
# is true and is not what these cells ask about. Written as `ok` they would be
# red in every engine forever — a defect of the harness, not of an engine.
#
# `@~ -1` is one program with two diagnostics, one per Rust engine.

id      = "runtime-loops-ranges"
what    = "the runtime diagnostics of ranges, steps, sleep and iteration: that each happens, and how it is met"
engines = ["zytw", "zyvm", "zyjs"]

[[cell]]
id     = "requires-integer-milliseconds-got"
expect = "error"
what   = "@~ requires integer milliseconds, got {}"
src    = """
t(v) {
    @~ v
    <~ 1
}
>> t("x") ¶
"""

[[cell]]
id     = "requires-integer-milliseconds-got-met"
expect = "ok"
what   = "and inside `!?` it is met, with the family the catch received"
src    = """
t(v) {
    @~ v
    <~ 1
}
!? {
    >> t("x") ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

