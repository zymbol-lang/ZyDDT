[[cell]]
id     = "constant-already-declared"
expect = "error"
what   = "constant '{}' already declared"
src    = """
C := 1
C := 2
>> C ¶
"""

[[cell]]
id     = "constant-already-declared-met"
expect = "error"
what   = "and `!?` does NOT meet it: a static refusal is not an error value"
# Asked for `ok` until D5 landed (F5, 2026-09-21), when a constant declared
# twice became a STATIC error in all three analyzers. A static refusal happens
# before anything runs, so there is no `!?` to catch it and no `##` family to
# print — which is the property this cell measures now. The `-met` question
# only has an answer for a refusal that happens at RUN time.
src    = """
C := 1
!? {
    C := 2
} :! {
    >> (_err#?)[1] ¶
}
>> C ¶
"""


# ── Juxtaposition with an Int literal on the right (added 2026-10-03) ───────
#
# `x = n 1` is the text "51": a juxtaposition, compiled as a Concat whose right
# operand is an Int literal. The VM's immediate fast path took it and reached an
# `unreachable!()` (GLB-085). `$#` asserts it is a String: on an Int it fails.

[[cell]]
id     = "juxtaposition-with-an-int-literal"
what   = "`x = n 1` with `n = 5` is the text \"51\": the VM's compiler panicked (GLB-085)"
expect = "ok"
src    = """
n = 5
x = n 1
y = 5 (1)
>> x ¶
>> x$# ¶
>> y ¶
"""
oracle.py = """
x = str(5) + str(1)
print(x)
print(len(x))
print(str(5) + str(1))
"""

# The neighbour of GLB-111: a name juxtaposed in an assignment is concatenation,
# and the language writes no warning for it — `s = s + 1  i = i + 1` is refused
# for the second `=`, not for the `i` (decided 2026-10-09).
[[cell]]
id     = "juxtaposition-with-a-name-is-concatenation"
what   = "`t = 1  i` with `i = 1` runs, is the text \"11\", and warns nothing — the neighbour GLB-111 left alone"
expect = "ok"
src    = """
i = 1
t = 1  i
>> t ¶
>> t$# ¶
"""
oracle.py = """
t = str(1) + str(1)
print(t)
print(len(t))
"""

# ── The kind of an arithmetic type error (added 2026-10-05) ────────────────
#
# Measured beside GLB-059: every arithmetic operator refused for its operands'
# types raises `##_` in the three engines, not `##Type` — the kind is read from
# the message's words and neither `arithmetic requires numeric operands` nor
# `+ is arithmetic only` contains one. D1 says a wrong type is a `##Type`
# (GLB-088, corrected 2026-10-05: the kind is declared where the error is raised,
# not read from the words). One cell per operator family: `-` names the types,
# `+` names them too now when no operand is text (GLB-059). The texts are held
# by the golden of zyquality/corpus/errors/runtime/arithmetic_type_errors.
# The empty value comes through `id`, whose type no analyser knows, so neither
# warns and the cell asks only the kind: with `x = ##_` directly, the Rust
# analyser warns on `x - 1` and zyjs does not, which is GLB-089's question.

[[cell]]
id     = "arithmetic-type-error-is-a-type-error"
expect = "ok"
what   = "`x - 1` with `x` empty is caught by `:! ##Type`, as D1 says a wrong type is (GLB-088)"
src    = """
id(v) { <~ v }
x = id(##_)
!? {
    >> (x - 1) ¶
} :! ##Type {
    >> "Type" ¶
}
"""

[[cell]]
id     = "plus-type-error-is-a-type-error"
expect = "ok"
what   = "`x + 1` with `x` empty, the same kind (GLB-088)"
src    = """
id(v) { <~ v }
x = id(##_)
!? {
    >> (x + 1) ¶
} :! ##Type {
    >> "Type" ¶
}
"""

# ── A name holding `##_`, in arithmetic (added 2026-10-05) ──────────────────
#
# `##_ - 1`, `#1 - 1`, `"a" - 1` and `[1] - 1` are warned statically by both
# analysers. With the empty value in a NAME — `x = ##_`, then `x - 1` — only the
# Rust one warned. Decided 2026-10-05 (GLB-089): it warns — the name holds Unit
# NOW, and the operation will fail. zyjs reads what the name holds now, and its
# return-type inference descends into `!?` and a statement `??` as Rust's does,
# which the control below needs: without that, a function returning from inside
# `!?` was taken to return Unit and its result warned.

[[cell]]
id     = "arithmetic-on-a-name-holding-unit"
expect = "warn"
what   = "`x = ##_` then `x - 1`: the analysers warn `arithmetic operation on non-numeric type: Unit` (GLB-089); the run-time refusal is caught, so the warning is what the cell asserts"
src    = """
x = ##_
!? {
    >> (x - 1) ¶
} :! {
    >> "refused" ¶
}
"""

[[cell]]
id     = "arithmetic-on-a-result-returned-from-inside-a-try"
expect = "ok"
what   = "the control: a function that returns only from inside `!? … :!` is not taken to return Unit, so arithmetic on its result does not warn"
src    = """
primero(a) {
    !? {
        <~ a[1]
    } :! {
        <~ 0
    }
}
x = primero([4, 5])
>> (x * 10) ¶
"""

# ── An assignment inside a block, seen from after it (added 2026-10-05) ────
#
# The Rust analyser recorded an assignment inside a block in the block's own
# scope, so after the block it forgot the type it gave an outer name. Decided
# 2026-10-05 (GLB-092): an assignment writes the name it reaches, and its type
# changes where the name was born — but not through a lambda, whose writes stay
# in it (MEM-6).

[[cell]]
id     = "arithmetic-after-a-block-assigned-the-name"
expect = "ok"
what   = "`x = ##_`, then `? #1 { x = 3 }`, then `x - 1`: after the block `x` is an Int, and nothing warns (GLB-092)"
src    = """
x = ##_
? #1 {
    x = 3
}
>> (x - 1) ¶
"""

# ── A type the analysers read from a name (added 2026-10-05) ────────────────
#
# For an operator's operand, zyjs read the LITERAL type a name was given, which
# becomes "cannot tell" once the name changes type; the Rust analyser reads what
# the name holds now. So `x = 1`, `x = "a"`, `x - 1` warned in Rust only. GLB-089
# decided to read what the name holds now for Unit; GLB-096 (decided 2026-10-06)
# extends it to every type, for arithmetic, logical and unary operators alike.
# A name can now hold a `Number` — a parameter inferred numeric — which is
# numeric, as in Rust: the control below.

[[cell]]
id     = "arithmetic-on-a-name-that-changed-type"
expect = "warn"
what   = "`x = 1`, `x = \"a\"`, then `x - 1`: both analysers warn `non-numeric type: String` — zyjs did not (GLB-096)"
src    = """
x = 1
x = "a"
!? {
    >> (x - 1) ¶
} :! {
    >> "refused" ¶
}
"""
[[cell]]
id     = "logical-on-a-name-that-changed-type"
expect = "warn"
what   = "`x = #1`, `x = 5`, then `x && #1`: both analysers warn `logical operation on non-boolean type: Int` (GLB-096)"
src    = """
x = #1
x = 5
!? {
    >> (x && #1) ¶
} :! {
    >> "refused" ¶
}
"""

[[cell]]
id     = "unary-on-a-name-that-changed-type"
expect = "warn"
what   = "`x = 1`, `x = \"a\"`, then `-x`: both analysers warn `unary - on non-numeric type: String` (GLB-096)"
src    = """
x = 1
x = "a"
!? {
    >> (-x) ¶
} :! {
    >> "refused" ¶
}
"""

[[cell]]
id     = "arithmetic-on-a-name-holding-an-inferred-number"
expect = "ok"
what   = "the control: a name given a parameter inferred numeric holds a `Number`, which is numeric — `x = a`, then `x - 1`, warns nothing"
src    = """
g(a) {
    y = a * 2
    x = a
    <~ (x - 1) + y
}
>> g(3) ¶
"""

# ── Two operands Rust can name and zyjs cannot (added 2026-10-06) ────────────
#
# Measured beside GLB-096: an empty array literal, which Rust calls `[Any]`; the
# iterator of an `@` whose name is new, which Rust gives the element's type; and
# a name holding a lambda, `() -> Int`. zyjs said "cannot tell" for all three and
# stayed silent. ZYJS-049, corrected 2026-10-06: zyjs names them as Rust does.
# The fourth operand of that finding, a name read by `<<`, is in runtime-io.

[[cell]]
id     = "arithmetic-on-an-empty-array-literal"
expect = "warn"
what   = "`[] - 1`: Rust warns `arithmetic operation on non-numeric type: [Any]`, zyjs did not (ZYJS-049)"
src    = """
!? {
    >> ([] - 1) ¶
} :! {
    >> "refused" ¶
}
"""

[[cell]]
id     = "arithmetic-on-a-new-iterator"
expect = "warn"
what   = "`@ c:\"ab\" { c - 1 }`: Rust warns `non-numeric type: Char`, zyjs did not — the new iterator had no type there (ZYJS-049)"
# Inside a function, where neither analyser gives the loop's lifetime warning:
# with it, zyjs would answer `warn` for another reason, and the cell would be a
# DIVERGE that a per-engine debt does not cover.
src    = """
f() {
    @ c:"ab" {
        !? {
            >> (c - 1) ¶
        } :! {
            >> "refused" ¶
        }
    }
}
f()
"""

[[cell]]
id     = "arithmetic-on-a-name-holding-a-lambda"
expect = "warn"
what   = "`x = 1`, `x = () -> 1`, then `x - 1`: Rust warns the change of type and `non-numeric type: () -> Int`, zyjs neither — it could not name a lambda's type (ZYJS-049)"
src    = """
x = 1
x = () -> 1
!? {
    >> (x - 1) ¶
} :! {
    >> "refused" ¶
}
"""


# ── The kind of a logical or comparison type error (added 2026-10-05) ──────
#
# Measured beside GLB-088: `&&`, `||`, `!` and an ordering between types that do
# not compare raised `##_` in the three engines. Decided 2026-10-05 (GLB-091): a
# `##Type`. A string against a number is not one of them — `"5" < 10` compares —
# and its kind is GLB-094's, below. Texts held by the golden of
# zyquality/corpus/errors/runtime/logical_comparison_type_errors.

[[cell]]
id     = "logical-type-error-is-a-type-error"
expect = "ok"
what   = "`n && #1` with `n` an Int is caught by `:! ##Type`, as D1 says a wrong type is (GLB-091)"
src    = """
id(v) { <~ v }
n = id(5)
!? {
    q = n && #1
    >> q ¶
} :! ##Type {
    >> "Type" ¶
}
"""

[[cell]]
id     = "comparison-type-error-is-a-type-error"
expect = "ok"
what   = "`b < n` between a Bool and an Int, two types that never compare, is caught by `:! ##Type` (GLB-091)"
src    = """
id(v) { <~ v }
n = id(5)
b = id(#1)
!? {
    q = b < n
    >> q ¶
} :! ##Type {
    >> "Type" ¶
}
"""

# ── A text compared with a number, when it is not one (added 2026-10-06) ─────
#
# `"5" < 10` compares — the text is a number. `"a" < 10` fails on the text's
# VALUE: reading it as a number is what failed, so it is a `##Parse` (GLB-094,
# decided 2026-10-06). The kind is declared where the error is raised. It used
# to be read from the words of the message, and the message carries the text,
# so `"index" < 10` was an `##Index` in the three engines. One cell per arm:
# they are four raise sites in each engine.

[[cell]]
id     = "text-against-an-integer-is-a-parse-error"
expect = "ok"
what   = "`\"a\" < n` with `n` an Int is caught by `:! ##Parse` — the text is not a number (GLB-094)"
src    = """
id(v) { <~ v }
n = id(10)
!? {
    q = id("a") < n
    >> q ¶
} :! ##Parse {
    >> "Parse" ¶
}
"""

[[cell]]
id     = "integer-against-a-text-is-a-parse-error"
expect = "ok"
what   = "`n > \"type\"`, the other order, is a `##Parse` — not the `##Type` the words of the text gave (GLB-094)"
src    = """
id(v) { <~ v }
n = id(10)
!? {
    q = n > id("type")
    >> q ¶
} :! ##Parse {
    >> "Parse" ¶
}
"""

[[cell]]
id     = "text-against-a-float-is-a-parse-error"
expect = "ok"
what   = "`\"index\" < f` with `f` a Float is a `##Parse` — not the `##Index` the words of the text gave (GLB-094)"
src    = """
id(v) { <~ v }
f = id(1.5)
!? {
    q = id("index") < f
    >> q ¶
} :! ##Parse {
    >> "Parse" ¶
}
"""

[[cell]]
id     = "float-against-a-text-is-a-parse-error"
expect = "ok"
what   = "`f >= \"division\"` is a `##Parse` — not the `##Div` the words of the text gave (GLB-094)"
src    = """
id(v) { <~ v }
f = id(1.5)
!? {
    q = f >= id("division")
    >> q ¶
} :! ##Parse {
    >> "Parse" ¶
}
"""
