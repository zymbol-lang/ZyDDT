# The diagnostic axis — a refusal is not one answer, it is three.
#
# `axes/refusal.toml` asks whether a malformed program is refused.  This axis
# asks whether the refusal is USABLE: does it say where, and does it say it in
# the one spelling the project settled on?
#
# It exists because the gate could never see any of this.  CHARTER § 2.1: the
# consensus run compares stdout, and a refusal has none.  Every finding here was
# invisible to ZyQuality by construction.

id      = "diagnostic"
what    = "a refusal that cannot be located or read is not a usable refusal"
engines = ["zytw", "zyvm", "zyjs"]
expect  = "error"
# `expect` is the floor: whatever else differs, these must not run.  The axis is
# about what happens ABOVE that floor, which the differential judges.

[[cell]]
id   = "location-on-a-lexer-error"
what = "a diagnostic raised while tokenising still has to say which line"
# DIVERGES 2026-08-28 (ZYJS-002).  zytw/zyvm say `--> file:2:5`; zyjs says
# nothing at all, because the diagnostic carries no `line` field and
# run_one.mjs only writes the location `if (d.line != null)`.
#
# The line is on line TWO on purpose.  A cell whose error is on line 1 cannot
# tell "reports the line" from "reports 1 for everything".
src  = """
x = 1
y = 9007199254740992
"""

[[cell]]
id   = "guidance-spelling"
what = "guidance goes on its own `= help:` line, not inside the message"
# Same divergence, other half.  zytw writes
#     error: integer literal out of range: '9007199254740992'
#       = help: integers range from … (±2⁵³−1)
# and zyjs folds the guidance into the message between parentheses.
#
# Not cosmetic: `= help:` is the spelling the whole toolchain agreed on, and the
# `=` is what a reader (and zyq) uses to tell guidance from the message itself.
# Folded into parentheses it cannot be separated by anything.
src  = """
>> 9007199254740992 ¶
"""

[[cell]]
id   = "base-prefix-with-no-digits"
what = "a base prefix with no digits after it is a language error, not a crash"
# ZYJS-003.  All four prefixes, one defect: `0x`, `0b`, `0o`, `0d` each collect
# their digits with a `while` that may match none, then call
# `String.fromCodePoint(parseInt('', N))` — `fromCodePoint(NaN)` throws, and the
# raw JavaScript RangeError reaches the user as `error: Invalid code point NaN`.
#
# It is refused either way, so `expect = "error"` is met and the axis floor does
# not catch it.  What catches it is the differential: an engine that answers
# with its own implementation's exception has not diagnosed anything.
#
# CLOSED 2026-08-30. The three prefixes below are cells for the reason the
# finding gave: four sites written identically, guarded in one commit, and one
# cell over them is three sites nothing holds down.
src  = """
>> 0xZZ ¶
"""

[[cell]]
id   = "binary-prefix-with-no-digits"
what = "`0b` with no binary digits after it"
src  = """
>> 0b22 ¶
"""

[[cell]]
id   = "octal-prefix-with-no-digits"
what = "`0o` with no octal digits after it"
src  = """
>> 0o99 ¶
"""

[[cell]]
id   = "decimal-prefix-with-no-digits"
what = "`0d` with no decimal digits after it"
src  = """
>> 0dAA ¶
"""

[[cell]]
id   = "bare-prefix-with-nothing-after-it"
what = "a base prefix at the very end of the expression"
# The easiest of the five to write by accident, and the one where the `while`
# has no chance at all of matching.
src  = """
>> 0x ¶
"""
