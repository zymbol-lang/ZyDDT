}
>> t("ab") ¶
"""

[[cell]]
id     = "map-over-a-dictionary-yields-its-keys"
expect = "ok"
what   = "a dictionary hands over its KEYS, exactly as `@ k:d` does (decision 8)"
# `zyjs` used to hand over the VALUES here, which contradicted its own loop.
# The keys are a list once they are out, so the answer is an array.
src    = """
t(v) {
    <~ v$> (k -> k)
}
>> t(#(x: 1, y: 2)) ¶
"""

