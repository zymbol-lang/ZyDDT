# ── A variable read, then written by a later operand through `<~` ───────────
#
# Operands are evaluated left to right (the `evaluation-order` axis), so in
# `x + inc(x<~)` the `x` is 5 when it is read, whatever `inc` writes to it
# afterwards. The tree-walker and zyjs answered 6; the VM read the register when
# the operator ran, after the write-back, and answered 16 (ZYVM-015, corrected
# 2026-10-10: a variable the statement also passes as `<~` is read into a
# temporary of its own).

[[cell]]
id     = "variable-read-before-a-later-operand-writes-it"
what   = "`x + inc(x<~)`, `(x, inc(x<~), x)` and `e = d$+ meter(d<~)`: the earlier read is the value before the call (ZYVM-015)"
expect = "ok"
oracle.py = """
def inc(box):
    box[0] += 10
    return 1
def meter(d):
    d.append(99)
    return 1
def show(v): return "[" + ", ".join(str(x) for x in v) + "]"
x = [5]
left = x[0]
y = left + inc(x)
print(y, x[0])
x = [5]
a = x[0]
b = inc(x)
c = x[0]
print(f"({a}, {b}, {c})")
d = [1, 2, 3]
read = list(d)
e = read + [meter(d)]
print(show(e), show(d))
"""
src    = """
inc(a<~) {
    a = a + 10
    <~ 1
}
meter(a<~) {
    a$+ 99
    <~ 1
}
x = 5
y = x + inc(x<~)
>> y " " x ¶
x = 5
t = (x, inc(x<~), x)
>> t ¶
d = [1, 2, 3]
e = d$+ meter(d<~)
>> e " " d ¶
"""

# ── A self-assignment whose operand writes its receiver (added 2026-10-10) ──
#
# The statement forms of the cell above: `d$+ meter(d<~)` is `d = d$+
# meter(d<~)`, and left to right the `d` on the left is read before the call
# writes it — so the call's write is overwritten by the assignment (GLB-115,
# decided 2026-10-10). The tree-walker edited `d` as the call had left it, on
# the operators that had a shortcut and only on those.

[[cell]]
id     = "self-assignment-whose-operand-writes-the-receiver"
what   = "`d$+ meter(d<~)`, `d[1]$~ meter(d<~)`, `d$-[meter(d<~)]`, `x = x + inc(x<~)` and `v = d[cambia(d<~)]`: the receiver is the value from before the call (GLB-115, ZYTW-014)"
expect = "ok"
src    = """
inc(a<~) {
    a = a + 10
    <~ 1
}
meter(a<~) {
    a$+ 99
    <~ 1
}
cambia(a<~) {
    a = [7, 8, 9, 6]
    <~ 1
}
d = [4, 2, 3]
d$+ meter(d<~)
>> d ¶
d = [4, 2, 3]
d[1]$~ meter(d<~)
>> d ¶
d = [4, 2, 3]
d$-[meter(d<~)]
>> d ¶
x = 5
x = x + inc(x<~)
>> x ¶
d = [10, 20, 30]
v = d[cambia(d<~)]
>> v " " d ¶
"""
oracle.py = """
def show(v): return "[" + ", ".join(str(x) for x in v) + "]"
def meter(d):
    d.append(99)
    return 1
d = [4, 2, 3]
read = list(d); d = read + [meter(d)]
