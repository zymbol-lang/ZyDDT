[[cell]]
id     = "map-over-a-tuple-keeps-the-tuple"
expect = "ok"
what   = "a HOF walks what `@` walks: a tuple in, a tuple out"
# Until step G4 the two Rust engines took an array and nothing else, while
# `zyjs` took everything and said so in generic words. Decided 2026-09-22: a
# higher-order operator walks whatever `@ e:v` hands over, which is one rule
# instead of a list of accepted types.
src    = """
t(v) {
    <~ v$> (x -> x)
}
>> t((1, 2)) ¶
"""

