# The runtime-functions-hof axis — Phase C, family C7 of the diagnostics plan.
#
# Calls, lambdas, the pipe and the higher-order operators given something that
# is not what they need: the runtime diagnostics no program provoked on
# 2026-09-14. `<id>` raises it, `<id>-met` catches it and prints the family.
# The value that is wrong — a number where a function goes, a lambda of the
# wrong arity — arrives through a parameter, so the analyzer lets it run.
#
# Three of this family have no cell (reasons in the queue): the compiler's two
# arity backstops, which the analyzer's own arity check always reaches first
# from the command line, and the sort comparator check, which the parser makes
# unreachable by requiring a lambda literal after `$^`.

id      = "runtime-functions-hof"
what    = "the runtime diagnostics of calls, lambdas, the pipe and the higher-order operators: that each happens, and how it is met"
engines = ["zytw", "zyvm", "zyjs"]

[[cell]]
id     = "expression-is-not-callable"
expect = "error"
what   = "expression is not callable"
src    = """
t(v) {
    <~ v[1](2)
}
>> t([5]) ¶
"""

[[cell]]
id     = "expression-is-not-callable-met"
expect = "ok"
what   = "and inside `!?` it is met, with the family the catch received"
src    = """
t(v) {
    <~ v[1](2)
}
!? {
    >> t([5]) ¶
} :! {
    >> (_err#?)[1] ¶
}
"""

[[cell]]
id     = "filter-requires-array-got"
