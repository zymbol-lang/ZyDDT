[[cell]]
id     = "sort-comparator-that-is-not-a-bool"
expect = "error"
what   = "a `$^` comparator that answers something other than a Bool is an error — decided 2026-09-15 (GLB-024), a ##Type: there is no truthiness. Before, no engine refused it — the tree-walker read an Int, 0 and a String all as false, the VM and zyjs as truthy; the comparators use their parameters, or zyjs warns them unused and hides the question (found in step 1.10, 2026-09-15; GLB-024)"
src    = """
v = [3, 1, 2]
>> (v$^ (a, b -> a - b)) ¶
>> (v$^ (a, b -> a * 0 + b * 0)) ¶
>> (v$^ (a, b -> "{a}{b}")) ¶
"""

[[cell]]
id     = "lambda-captures-a-name-read-in-a-string"
expect = "ok"
what   = "a lambda captures a name it reads only inside an interpolation — the tree-walker's capture walk skipped string parts, so `{log}` stayed as text there while the VM and zyjs read it (found in step 2.15, 2026-09-15; ZYTW-005)"
src    = """
log = ""
tag = (s -> { log = "{log}{s}"  <~ log })
>> tag("A") " " tag("B") ¶
"""

[[cell]]
id     = "local-destroyed-in-a-branch-not-taken"
expect = "ok"
what   = "a function-local destroyed only in a branch that does not run is still readable afterwards, as at file level — the VM refuses the read (found in step 2.15, 2026-09-15; ZYVM-005)"
src    = """
f() {
    y = 2
    ? #0 { \\ y }
    <~ y
}
>> f() ¶
"""

[[cell]]
