# The lifetime axis — MEM-8, the two ways a value stops existing.
#
# ── Why it needed an axis of its own ────────────────────────────────────────
#
# Automatic release is required to be INVISIBLE, so no cell can observe it: a
# correct program prints the same thing either way, which is exactly what makes
# a differential blind to it. That half is measured by `zyquality/cost/`, as a
# ratio of peak memory against a control — a claim about cost, which is not
# something a cell can make.
#
# What a cell CAN ask is the other half. `\ x` is the exception the premise
# declares: it is observable on purpose, and using the name afterwards is an
# error. That is a category, and a category is what `expect` asserts.
#
# ── What was found the moment it was asked ──────────────────────────────────
#
# The corpus has two files that use `\`, and both destroy a name and never touch
# it again. Nobody had written the case the premise is about, so no consensus
# run had ever compared it — and the three engines do not agree:
#
#   zytw, zyvm   runtime, after half the output is written, saying
#                `use after destruction: variable 'x' was destroyed …`
#   zyjs         before running, saying `undefined variable 'x'` — which does
#                not say a destruction happened at all
#
# Each engine has a different half right: the browser one refuses at the better
# moment, the Rust ones say the better thing. Recorded as GLB-008.

id      = "lifetime"
what    = "how a value stops existing, and what may be said about it afterwards"
engines = ["zytw", "zyvm", "zyjs"]
premise = "MEM-8"

[[cell]]
id   = "use-after-destruction"
what = "a name used after `\\` destroys it"
# expect = error only: WHICH error, and when, is exactly what diverges, and
# asserting either would be picking a winner before the author has.
src  = """
x = "dato"
>> x ¶
\\ x
>> x ¶
"""

[[cell]]
id     = "destroy-then-reassign"
expect = "ok"
what   = "a destroyed name comes back when it is assigned again"
# `\` ends a life, it does not burn the name. Without this cell the rule above
# could be met by refusing the name forever, which would be a different language.
src    = """
x = 1
\\ x
x = 2
>> x ¶
"""

[[cell]]
id     = "destroy-what-is-finished-with"
expect = "ok"
what   = "destroying a name that is never touched again is the ordinary case"
src    = """
x = 1
>> x ¶
\\ x
>> "sigue" ¶
"""

[[cell]]
id     = "destroy-inside-a-function"
expect = "ok"
what   = "a function may destroy its own local"
src    = """
f() { x = 1
\\ x
<~ "hecho" }
>> f() ¶
"""

[[cell]]
id     = "destroy-in-a-branch-not-taken"
expect = "ok"
what   = "a `\\` that never runs destroys nothing"
# The cell that decides HOW the rule may be enforced, and it was written after
# GLB-008's proposed fix turned out to be backwards. Moving the check into the
# analyser sounded like the obvious repair — one engine already did it — until
# this case was asked: `zytw` prints 1 because the branch never ran, and `zyjs`
# refuses the program. A static check with no flow analysis cannot tell a
# destruction that happened from one that was merely written down, so the
# run-time answer is not the late one, it is the only correct one.
src    = """
x = 1
? #0 { \\ x }
>> x ¶
"""

[[cell]]
id     = "destroy-a-name-that-does-not-exist"
expect = "error"
what   = "`\\ nada` destroys a name that was never defined"
# GLB-055, decided 2026-09-25: a static error, the one a read gives. MEM-8 made
# use-after-destruction a RUN-TIME error because only running tells a `\` that
# ran from one that was written down; whether a name is VISIBLE is not that
# question, and `? #0 { >> nada ¶ }` was already refused before anything runs.
# Both Rust engines accepted this in silence.
src    = """
\\nada
>> "fin" ¶
"""

[[cell]]
id     = "destroy-a-missing-name-in-a-branch-not-taken"
expect = "error"
what   = "`\\ nada` inside `? #0 { }` is refused before running, as `>> nada` is there"
# The control that decided GLB-055: the same branch with a read is a static
# error in all three engines.
src    = """
? #0 { \\nada }
>> "fin" ¶
"""

[[cell]]
id     = "destroy-a-block-local-after-its-block"
expect = "error"
what   = "a name born in a block is gone after it, for `\\` as for a read (MEM-6)"
src    = """
? #1 { y = 1 }
\\y
>> "fin" ¶
"""

[[cell]]
id     = "destroy-a-hot-counter-after-its-loop"
expect = "error"
what   = "`i°` dies with its loop; destroying it afterwards names nothing — the case GLB-055 was found with"
src    = """
n = 0
@ n < 3 {
    i° += 1
    n += 1
}
\\i
>> "fin" ¶
"""

[[cell]]
id     = "destroy-twice"
expect = "error"
what   = "a second `\\` that runs is a use after the first, at run time (GLB-055)"
src    = """
x = 1
\\x
\\x
>> "fin" ¶
"""

[[cell]]
id     = "destroy-twice-in-a-loop"
expect = "error"
what   = "the second pass of a loop destroys what the first already destroyed"
src    = """
x = 1
@ 2 { \\x }
>> "fin" ¶
"""

[[cell]]
id     = "destroy-after-a-destruction-that-did-not-run"
expect = "ok"
what   = "why the double `\\` is a run-time error: a `\\` in a branch not taken destroyed nothing"
src    = """
x = 1
? #0 { \\x }
\\x
>> "fin" ¶
"""

[[cell]]
id     = "destroy-a-constant"
expect = "error"
what   = "a constant lives as long as the program (MEM-1): `\\ K` is refused before running"
# Destroyed, the name could be neither reassigned nor declared again.
src    = """
K := 1
\\K
>> "fin" ¶
"""

[[cell]]
id     = "destroy-a-constant-inside-a-function"
expect = "error"
what   = "a function cannot end a global constant"
# Was a `\` that did nothing in both Rust engines, and ended the global in zyjs.
src    = """
K := 1
f() {
    \\K
    <~ "hecho"
}
>> f() ¶
>> K ¶
"""

[[cell]]
id     = "destroy-a-function"
expect = "error"
what   = "only a variable can be destroyed: `\\ f` on a named function is refused"
# Both Rust engines ran it and `f()` still answered; zyjs destroyed it.
src    = """
f() { <~ 1 }
\\f
>> f() ¶
"""

[[cell]]
id     = "destroy-a-module-alias"
expect = "error"
what   = "only a variable can be destroyed: `\\ m` on a module alias is refused"
# All three ran it, and `m::saluda()` still answered: a `\` that did nothing.
src    = """
<# ./m/saludo => m
\\m
>> m::saluda() ¶
"""
[cell.files]
"m/saludo.zy" = """
# saludo {
    #> { saluda }
    saluda() { <~ "hola" }
}
"""

[[cell]]
id     = "destroy-a-file-variable-from-a-function"
expect = "error"
what   = "a function cannot end a name it cannot see (MEM-2)"
# Was a no-op in both Rust engines and ended the file's `x` in zyjs.
src    = """
x = 1
f() {
    \\x
    <~ "hecho"
}
>> f() ¶
>> x ¶
"""

[[cell]]
id     = "a-lambda-destroys-its-own-copy"
expect = "ok"
what   = "a lambda's `\\ x` ends its copy, never the file's `x` (MEM-6: it writes only what it declares)"
# zyjs ended the file's `x`, and so did the VM, invisibly: its `DestroyGlobal`
# ran from any body, where a write to a file variable runs only from `<main>`.
src    = """
x = 1
g = () -> {
    \\x
    <~ "hecho"
}
>> g() ¶
>> g() ¶
>> x ¶
"""

[[cell]]
id     = "a-function-that-destroys-its-parameter-called-twice"
expect = "ok"
what   = "each call has its own parameter: the mark of one call is not the next one's"
# zyvm failed the SECOND call: its destroyed-slot marks are absolute and were
# never cleared when a frame ended, so `>> p` read the previous call's mark.
src    = """
f(p) {
    >> p ¶
    \\p
    <~ "hecho"
}
>> f(1) ¶
>> f(2) ¶
"""

[[cell]]
id     = "a-lambda-that-reads-then-destroys-called-twice"
expect = "ok"
what   = "a lambda's captured copy is fresh at every call"
src    = """
x = 1
g = () -> {
    >> x ¶
    \\x
    <~ "hecho"
}
>> g() ¶
>> g() ¶
"""

[[cell]]
id     = "read-a-destroyed-parameter"
expect = "error"
what   = "reading a parameter after `\\ p` is a use after destruction"
# ZYJS-030, open: zyjs says `'p' is undefined — did you mean 'p°' (hot
# definition)?`. Its `Env.get` checks for a destruction only at the root, and a
# function's frame ends at its boundary before reaching it.
src    = """
f(p) {
    \\p
    <~ p
}
>> f(1) ¶
"""

[[cell]]
id     = "read-a-lambda-copy-after-destroying-it"
expect = "error"
what   = "inside a lambda, reading the copy it destroyed is a use after destruction"
# ZYJS-030, open: the same path as a parameter.
src    = """
x = 1
g = () -> {
    \\x
    <~ x
}
>> g() ¶
"""

[[cell]]
id     = "call-a-destroyed-lambda"
expect = "error"
what   = "calling a lambda variable after `\\ g` is a use after destruction"
# ZYTW-007, open: the tree-walker says `undefined function: 'g'`, while zyvm and
# zyjs say `use after destruction`.
src    = """
g = () -> 1
\\g
>> g() ¶
"""
